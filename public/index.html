<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verus Fleet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 12l4-5 3 3 6-8%22 fill=%22none%22 stroke=%22%232a78d6%22 stroke-width=%222%22/%3E%3C/svg%3E">
<script>try { var th = JSON.parse(localStorage.getItem('vp.theme')); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-ink: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-ink: #0ca30c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
header .meta { color: var(--ink-2); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ring); color: var(--ink-2); }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.live-dot.off { background: var(--critical); }
.spacer { flex: 1; }
.logout { color: var(--ink-2); font-size: 13px; }

.card { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); }
.kpis { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.kpi { padding: 14px 16px; min-width: 0; }
.kpi .label { color: var(--ink-2); font-size: 12.5px; }
.kpi .value { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; white-space: nowrap; }
.kpi.hero .value { font-size: 34px; }
.kpi .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } .kpi.hero { grid-column: 1 / -1; } }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 12px; }
.filters input, .filters select, .btn {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 0; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; padding: 6px 10px; height: 32px;
}
.filters input[type=search] { width: 220px; max-width: 100%; }
.btn { cursor: pointer; }
.btn:hover { background: var(--wash); }
.filters .count { color: var(--ink-2); font-size: 13px; margin-left: 4px; }
.seg { display: inline-flex; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; overflow: hidden; height: 30px; }
.seg button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--ink-2); padding: 0 10px; cursor: pointer; }
.seg button + button { box-shadow: -1px 0 0 var(--ring); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }

.chart-card { padding: 14px 16px 10px; }
.chart-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; }
.chart-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 2px 0 6px; min-height: 18px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
.chart { position: relative; height: 300px; transition: opacity .2s; }
.chart.loading { opacity: .55; }
@media (max-width: 600px) { .chart { height: 220px; } }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  min-width: 160px; display: none;
}
.tip .when { color: var(--muted); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .row i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip .row b { font-weight: 650; font-variant-numeric: tabular-nums; min-width: 72px; }
.tip .row span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

.table-card { margin-top: 12px; }
.table-card .table-scroll { border-radius: 12px 12px 0 0; }
.pools-card { margin-bottom: 12px; overflow: hidden; }
.pools-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px 8px; }
.pools-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.pools-head .hint { color: var(--muted); font-size: 12.5px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle button { width: 34px; height: 20px; border-radius: 999px; border: 0; padding: 0; position: relative; cursor: pointer;
  background: var(--axis); transition: background .15s; }
.toggle button::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle button[aria-checked="true"] { background: var(--good); }
.toggle button[aria-checked="true"]::after { transform: translateX(14px); }
.toggle button:disabled { opacity: .5; cursor: not-allowed; }
.pools-card td.err { color: var(--muted); max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ring); color: var(--ink-2); margin-left: 6px; }
.btn.small { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.events { padding: 8px 16px 12px; color: var(--ink-2); font-size: 12.5px; display: grid; gap: 2px; }
.events .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
.events .by { color: var(--muted); margin-right: 6px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; }
th.nosort { cursor: default; }
th .arr { color: var(--muted); margin-left: 3px; font-size: 10px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--wash); }
tbody tr.offline td { color: var(--muted); }
td .key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; vertical-align: middle; margin-left: 6px; }
td.name { font-weight: 600; }
td .dim { color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.status i, .temp i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.temp { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.forget { font: inherit; font-size: 12px; color: var(--ink-2); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; }
.table-foot { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: var(--muted); font-size: 12.5px; }
.table-foot > span { flex: 1; min-width: 0; }
.table-foot .colmenu { flex: none; }
input[type=checkbox] { accent-color: var(--s1); width: 15px; height: 15px; margin: 0; vertical-align: middle; cursor: pointer; }

.colmenu { position: static; }
/* menus open from the footer's right edge so they always stay on screen */
.colmenu .panel {
  position: absolute; right: 12px; bottom: 50px; z-index: 10; background: var(--surface); border-radius: 10px;
  box-shadow: 0 0 0 1px var(--ring), 0 8px 24px rgba(0,0,0,.14); padding: 8px; display: none; width: 210px;
  max-height: min(460px, 70vh); overflow: auto;
}
.colmenu.open .panel { display: block; }
th.dragging { opacity: .4; }
th.drop-l { box-shadow: inset 2px 0 0 var(--s1); }
th.drop-r { box-shadow: inset -2px 0 0 var(--s1); }
.col-hint { color: var(--muted); font-size: 12px; padding: 2px 6px 6px; }
.col-row { display: flex; align-items: center; gap: 2px; }
.col-row label { flex: 1; }
.col-row .linkbtn:disabled { opacity: .3; cursor: default; }
.colmenu label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.colmenu label:hover { background: var(--wash); }
.note { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
.ssh-card { margin-top: 12px; padding: 14px 16px 12px; }
.ssh-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.ssh-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.ssh-head .hint { color: var(--muted); font-size: 12.5px; }
.ssh-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ssh-form select, .ssh-form input { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 0;
  box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; height: 32px; padding: 0 10px; }
.ssh-form select { max-width: 260px; }
.ssh-form input { flex: 1; min-width: 220px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.ssh-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.chip { font: inherit; font-size: 12.5px; color: var(--ink-2); background: transparent; border: 0; box-shadow: inset 0 0 0 1px var(--ring);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip:hover, .chip[aria-pressed="true"] { background: var(--wash); color: var(--ink); }
.ssh-setup { margin: 4px 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--wash); font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.ssh-setup code, .ssh-setup pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.ssh-setup pre { white-space: pre-wrap; word-break: break-all; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; padding: 8px 10px; margin: 6px 0; color: var(--ink); }
.ssh-runs { margin-top: 12px; border-top: 1px solid var(--grid); }
.run { border-bottom: 1px solid var(--grid); }
.run-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 2px; cursor: pointer; font-size: 13px; }
.run-head:hover { background: var(--wash); }
.run-head .when { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; }
.run-head .cmd { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.run-head .counts { white-space: nowrap; display: inline-flex; gap: 10px; color: var(--ink-2); font-size: 12.5px; }
.run-head .caret { color: var(--muted); width: 10px; }
.run-body { padding: 0 2px 10px 22px; }
.run-tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 8px; color: var(--muted); font-size: 12.5px; align-items: center; }
.res { padding: 6px 0; border-top: 1px dashed var(--grid); }
.res-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; }
.res-head b { font-weight: 600; }
.res-head .dim { color: var(--muted); font-size: 12px; }
.res .note { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; }
.res pre { margin: 6px 0 0; padding: 8px 10px; max-height: 240px; overflow: auto; background: var(--page); border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--ring); font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
.res pre.err { color: var(--ink-2); }
.sshbtn { font: inherit; font-size: 12px; color: var(--ink-2); background: none; border: 0; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.sshbtn:hover { background: var(--wash); color: var(--ink); }
select.gsel { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0; border-radius: 6px;
  padding: 3px 4px; max-width: 150px; cursor: pointer; }
select.gsel:hover, select.gsel:focus { box-shadow: inset 0 0 0 1px var(--ring); background: var(--surface); }
select.gsel.none { color: var(--muted); }
.colmenu .panel.wide { width: min(360px, calc(100vw - 32px)); padding: 10px; }
.add-form textarea { width: 100%; min-height: 96px; resize: vertical; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--ink); background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; padding: 8px 10px; }
.add-form .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; color: var(--ink-2); font-size: 13px; }
.add-form .row select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; height: 28px; padding: 0 6px; max-width: 170px; }
.add-form .help { color: var(--muted); font-size: 12.5px; margin: 0 0 6px; line-height: 1.45; }
.add-form .result { font-size: 12.5px; margin-top: 8px; line-height: 1.5; }
.add-form .result .bad { color: var(--critical); }
.gp-move { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 2px 10px; border-bottom: 1px solid var(--grid); margin-bottom: 6px; color: var(--ink-2); font-size: 13px; }
.gp-move select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; height: 28px; padding: 0 6px; max-width: 170px; }
.gp-row { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 6px 4px; border-radius: 6px; }
.gp-row:hover { background: var(--wash); }
.gp-row .gname { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gp-row .gmeta { grid-column: 2 / 4; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.gp-row .gact { display: flex; gap: 4px; }
.gp-empty { color: var(--muted); font-size: 12.5px; padding: 6px 4px; }
.linkbtn { font: inherit; font-size: 12px; color: var(--ink-2); background: none; border: 0; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.linkbtn:hover { background: var(--wash); color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Verus fleet</h1>
    <div class="meta">
      <span id="poolInfo">—</span>
      <span id="liveInfo"><span class="live-dot"></span>connecting…</span>
      <span id="demoBadge" class="badge" hidden>Demo data</span>
      <a id="logout" href="logout" hidden class="logout">Log out</a>
    </div>
    <span class="spacer"></span>
    <div class="seg" id="themeSeg" role="group" aria-label="Theme">
      <button data-v="auto" title="Follow the system setting">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
    </div>
  </header>

  <section class="kpis">
    <div class="card kpi hero"><div class="label" id="kHashLabel">Fleet hashrate</div><div class="value" id="kHash">—</div><div class="sub" id="kHashSub">—</div></div>
    <div class="card kpi"><div class="label">Devices online</div><div class="value" id="kOnline">—</div><div class="sub" id="kOnlineSub">—</div></div>
    <div class="card kpi"><div class="label">Average per device</div><div class="value" id="kAvg">—</div><div class="sub" id="kAvgSub">—</div></div>
    <div class="card kpi"><div class="label">Shares</div><div class="value" id="kShares">—</div><div class="sub" id="kSharesSub">—</div></div>
    <div class="card kpi"><div class="label">CPU temperature</div><div class="value" id="kTemp">—</div><div class="sub" id="kTempSub">—</div></div>
  </section>

  <section class="card pools-card" id="poolsCard" hidden>
    <div class="pools-head">
      <h2>Pools</h2>
      <span class="hint" id="poolsHint"></span>
      <span class="spacer"></span>
      <span class="toggle"><button id="autoToggle" role="switch" aria-checked="false" aria-label="Auto failover"></button><label for="autoToggle">Auto failover</label></span>
      <button class="btn small" id="resetPreferred" hidden>Use priority order</button>
    </div>
    <div class="table-scroll"><table>
      <thead><tr><th class="nosort num">#</th><th class="nosort">Pool</th><th class="nosort">Status</th><th class="nosort num">Ping</th><th class="nosort num">Pool-side</th><th class="nosort num">Accepted</th><th class="nosort num">Rejected</th><th class="nosort num" title="Time since the pool's last new job. Long gaps are normal - Verus blocks have no time limit - and never cause a switch.">Last job</th><th class="nosort">Last problem</th><th class="nosort"></th></tr></thead>
      <tbody id="poolsBody"></tbody>
    </table></div>
    <div class="events" id="poolEvents"></div>
  </section>

  <div class="filters" role="group" aria-label="Filters">
    <div class="seg" id="rangeSeg" role="group" aria-label="Time range">
      <button data-v="1h">1h</button><button data-v="6h">6h</button><button data-v="24h">24h</button><button data-v="7d">7d</button><button data-v="30d">30d</button>
    </div>
    <div class="seg" id="metricSeg" role="group" aria-label="Hashrate source">
      <button data-v="rep" title="What ccminer reports on each device">Device-reported</button><button data-v="eff" title="Calculated from shares accepted by the pool">Pool-side</button>
    </div>
    <input type="search" id="q" placeholder="Search name, model, IP…" aria-label="Search devices">
    <select id="fStatus" aria-label="Status"><option value="">All statuses</option><option value="online">Online</option><option value="reconnecting">Reconnecting</option><option value="stale">No shares</option><option value="elsewhere">Mining elsewhere</option><option value="idle">Not mining</option><option value="offline">Offline</option></select>
    <select id="fGroup" aria-label="Group"><option value="">All groups</option></select>
    <select id="fMake" aria-label="Make"><option value="">All makes</option></select>
    <select id="fOs" aria-label="System"><option value="">All systems</option></select>
    <select id="fTemp" aria-label="Temperature"><option value="">Any temperature</option><option value="60">CPU ≥ 60 °C</option><option value="70">CPU ≥ 70 °C</option><option value="80">CPU ≥ 80 °C</option></select>
    <span class="count" id="filterCount"></span>
    <button class="btn" id="clearFilters" hidden>Clear</button>
  </div>

  <section class="card chart-card">
    <div class="chart-head">
      <h2 id="chartTitle">Hashrate</h2>
      <span class="spacer"></span>
      <button class="btn" id="plotGroups" hidden title="Plot each group's total as its own line (up to 6)">Plot groups</button>
      <button class="btn" id="plotFiltered" title="Plot each filtered device as its own line (up to 6)">Plot filtered devices</button>
      <button class="btn" id="toggleTotals" hidden title="Hide the total lines so individual devices fill the chart">Hide totals</button>
      <button class="btn" id="clearPlot" hidden>Clear plotted</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"><svg id="svg" aria-label="Hashrate over time"></svg><div class="tip" id="tip"></div></div>
  </section>

  <section class="card table-card">
    <div class="table-scroll"><table id="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="table-foot">
      <span id="tableNote">Tick a device to plot it. Click a column to sort.</span>
      <div class="colmenu" id="addmenu"><button class="btn" id="addBtn" title="Add devices by IP address, e.g. to reach them over SSH before they mine">Add devices</button><div class="panel wide" id="addPanel"></div></div>
      <div class="colmenu" id="groupmenu"><button class="btn" id="groupBtn">Groups</button><div class="panel wide" id="groupPanel"></div></div>
      <div class="colmenu" id="colmenu"><button class="btn" id="colBtn">Columns</button><div class="panel" id="colPanel"></div></div>
    </div>
  </section>
  <section class="card ssh-card" id="sshCard" hidden>
    <div class="ssh-head">
      <h2>Remote commands</h2>
      <span class="hint" id="sshHint"></span>
      <span class="spacer"></span>
      <button class="btn small" id="sshSetupBtn">Setup</button>
    </div>
    <div class="ssh-setup" id="sshSetup" hidden></div>
    <div class="ssh-form">
      <select id="sshTarget" aria-label="Devices to run on"></select>
      <select id="sshPort" aria-label="SSH port" hidden></select>
      <input id="sshCmd" class="mono" placeholder="Command to run in Termux, e.g. uptime" aria-label="Command" autocomplete="off" spellcheck="false">
      <button class="btn" id="sshRun">Run</button>
    </div>
    <div class="ssh-presets" id="sshPresets"></div>
    <div class="ssh-runs" id="sshRuns"></div>
  </section>
  <p class="note" id="footNote"></p>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = {
  get(k, d) { try { const v = localStorage.getItem('vp.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vp.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- formatting ----------
function fmtH(h, digits) {
  if (h === null || h === undefined || !isFinite(h)) return '—';
  const u = ['H/s','kH/s','MH/s','GH/s','TH/s','PH/s'];
  let i = 0; while (Math.abs(h) >= 1000 && i < u.length - 1) { h /= 1000; i++; }
  const d = digits !== undefined ? digits : (Math.abs(h) >= 100 ? 1 : 2);
  return h.toFixed(d) + ' ' + u[i];
}
function fmtDur(sec) {
  if (sec === null || sec === undefined || !isFinite(sec)) return '—';
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  if (m) return m + 'm';
  return sec + 's';
}
function fmtAgo(ts, now) { return ts ? fmtDur((now - ts) / 1000) + ' ago' : '—'; }
const fmtInt = (n) => n === null || n === undefined ? '—' : Math.round(n).toLocaleString();
function tempLevel(t) {
  if (t === null || t === undefined) return null;
  if (t >= 80) return ['--critical', 'critical'];
  if (t >= 70) return ['--serious', 'hot'];
  if (t >= 60) return ['--warning', 'warm'];
  return ['--good', 'ok'];
}
const STATUS = { online: ['--good', 'Online'], idle: ['--muted', 'Not mining'], reconnecting: ['--warning', 'Reconnecting'], stale: ['--warning', 'No shares'], elsewhere: ['--serious', 'Mining elsewhere'], offline: ['--critical', 'Offline'] };

// ---------- state ----------
const state = {
  range: store.get('range', '6h'),
  metric: store.get('metric', 'rep'),
  sort: store.get('sort', { key: 'hash', dir: -1 }),
  plotted: store.get('plotted', []),
  showTotals: store.get('showTotals', true),
  theme: store.get('theme', 'auto'),
  colOrder: store.get('colOrder', null),
  hiddenCols: store.get('hiddenCols', ['address','kernel','arch','ram','load','ping','freq','firstSeen','minerShares','threads']),
  stats: null, history: null, demo: false, lastOk: 0
};

// ---------- columns ----------
const hashOf = (w) => state.metric === 'rep' ? (w.repHashrate ?? null) : w.effHashrate;
const COLS = [
  { key: 'plot', label: '', nosort: true, fixed: true },
  { key: 'status', label: 'Status', val: w => ({ online: 0, reconnecting: 1, stale: 2, elsewhere: 3, idle: 4, offline: 5 })[w.status] },
  { key: 'name', label: 'Worker', val: w => w.name.toLowerCase(), fixed: true },
  { key: 'group', label: 'Group', val: w => w.group ? w.group.toLowerCase() : null },
  { key: 'make', label: 'Make', val: w => (w.make || '').toLowerCase() },
  { key: 'model', label: 'Model', val: w => (w.model || '').toLowerCase() },
  { key: 'soc', label: 'SoC / CPU', val: w => (w.soc || '').toLowerCase() },
  { key: 'os', label: 'System', val: w => (w.os || '').toLowerCase() },
  { key: 'kernel', label: 'Kernel', val: w => w.kernel || '' },
  { key: 'arch', label: 'Arch', val: w => w.arch || '' },
  { key: 'cores', label: 'Cores', num: true, val: w => w.cores },
  { key: 'freq', label: 'CPU MHz', num: true, val: w => w.cpuFreq },
  { key: 'ram', label: 'RAM', num: true, val: w => w.ramMB },
  { key: 'temp', label: 'CPU °C', num: true, val: w => w.cpuTemp },
  { key: 'battery', label: 'Battery', num: true, val: w => w.batteryTemp ?? w.batteryLevel },
  { key: 'load', label: 'Load', num: true, val: w => w.load },
  { key: 'hash', label: 'Hashrate', num: true, val: w => hashOf(w) },
  { key: 'other', label: 'Pool-side', num: true, val: w => state.metric === 'rep' ? w.effHashrate : w.repHashrate },
  { key: 'perCore', label: 'Per core', num: true, val: w => { const h = hashOf(w); return h && w.cores ? h / w.cores : null; } },
  { key: 'threads', label: 'Threads', num: true, val: w => w.threads ? w.threads.length : null },
  { key: 'shares', label: 'Accepted', num: true, val: w => w.accepted },
  { key: 'rej', label: 'Reject %', num: true, val: w => (w.accepted + w.rejected) ? w.rejected / (w.accepted + w.rejected) : null },
  { key: 'minerShares', label: 'ccminer A/R', num: true, val: w => w.minerAccepted },
  { key: 'software', label: 'Miner', val: w => w.software || '' },
  { key: 'ping', label: 'Ping ms', num: true, val: w => w.ping },
  { key: 'ip', label: 'IP', val: w => (w.ip || '').split('.').map(x => x.padStart(3, '0')).join('.') },
  { key: 'address', label: 'Wallet', val: w => w.address || '' },
  { key: 'uptime', label: 'Mining for', num: true, val: w => w.minerUptime ?? (w.connectedSince ? (state.stats.time - w.connectedSince) / 1000 : null) },
  { key: 'lastShare', label: 'Last share', num: true, val: w => w.lastShare ? -w.lastShare : null },
  { key: 'firstSeen', label: 'First seen', num: true, val: w => w.firstSeen },
  { key: 'action', label: '', nosort: true, fixed: true }
];

// columns in the viewer's order (saved per browser); the tick box stays first and the actions last
const PINNED_FIRST = 'plot', PINNED_LAST = 'action';
function orderedCols() {
  const movable = COLS.filter(c => c.key !== PINNED_FIRST && c.key !== PINNED_LAST);
  const order = (state.colOrder || []).filter(k => movable.some(c => c.key === k));
  // columns added in a later version go after the column they follow by default
  for (const c of movable) {
    if (order.includes(c.key)) continue;
    const i = movable.indexOf(c);
    const prev = i > 0 ? order.indexOf(movable[i - 1].key) : -1;
    order.splice(prev + 1, 0, c.key);
  }
  return [COLS.find(c => c.key === PINNED_FIRST), ...order.map(k => COLS.find(c => c.key === k)), COLS.find(c => c.key === PINNED_LAST)];
}
function moveCol(key, toKey, after) {
  const order = orderedCols().map(c => c.key).filter(k => k !== PINNED_FIRST && k !== PINNED_LAST && k !== key);
  let i = order.indexOf(toKey);
  if (i < 0) i = order.length; else if (after) i++;
  order.splice(i, 0, key);
  state.colOrder = order; store.set('colOrder', order);
  renderTable(); renderColMenu();
}
function visibleCols() { return orderedCols().filter(c => c.fixed || !state.hiddenCols.includes(c.key)); }

// ---------- filtering ----------
function filters() {
  return { q: $('q').value.trim().toLowerCase(), status: $('fStatus').value, group: $('fGroup').value, make: $('fMake').value, os: $('fOs').value, temp: Number($('fTemp').value) || 0 };
}
function filterActive(f) { return !!(f.q || f.status || f.group || f.make || f.os || f.temp); }
function filtered() {
  if (!state.stats) return [];
  const f = filters();
  return state.stats.workers.filter(w => {
    if (f.status && w.status !== f.status) return false;
    if (f.group === NO_GROUP ? !!w.group : (f.group && w.group !== f.group)) return false;
    if (f.make && (w.make || 'Unknown') !== f.make) return false;
    if (f.os && osFamily(w.os) !== f.os) return false;
    if (f.temp && !(w.cpuTemp >= f.temp)) return false;
    if (f.q) {
      const hay = [w.name, w.group, w.make, w.model, w.soc, w.os, w.ip, w.software, w.address].join(' ').toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    return true;
  });
}
const NO_GROUP = '\u0000none';
const NEW_GROUP = '\u0000new';
function groupNames() { return state.stats && state.stats.groups ? state.stats.groups.map(g => g.name) : []; }
function fillGroupFilter() {
  const sel = $('fGroup'), cur = sel.value, names = groupNames();
  const sig = names.join('|');
  if (sel.dataset.sig === sig) return;
  sel.dataset.sig = sig;
  sel.textContent = '';
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };
  add('', 'All groups');
  for (const n of names) add(n, n);
  add(NO_GROUP, 'No group');
  sel.value = cur === '' || cur === NO_GROUP || names.includes(cur) ? cur : '';
  sel.hidden = names.length === 0 && sel.value === '';
}
function osFamily(os) { if (!os) return 'Unknown'; const m = os.match(/^(Android \d+|[A-Za-z]+(?: [A-Za-z]+)?(?: \d+)?)/); return m ? m[1] : os; }

function fillSelect(sel, values, label) {
  const cur = sel.value;
  const opts = ['', ...Array.from(new Set(values)).sort()];
  if (sel.dataset.sig === opts.join('|')) return;
  sel.dataset.sig = opts.join('|');
  sel.textContent = '';
  for (const v of opts) { const o = document.createElement('option'); o.value = v; o.textContent = v || label; sel.appendChild(o); }
  sel.value = opts.includes(cur) ? cur : '';
}

// ---------- KPIs ----------
function renderKpis() {
  const s = state.stats, t = s.totals, now = s.time;
  const rep = t.repHashrate, eff = t.effHashrate;
  const main = state.metric === 'rep' && rep > 0 ? rep : eff;
  $('kHashLabel').textContent = state.metric === 'rep' && rep > 0 ? 'Fleet hashrate · device-reported' : 'Fleet hashrate · pool-side';
  $('kHash').textContent = fmtH(main);
  $('kHashSub').textContent = state.metric === 'rep' && rep > 0
    ? 'Pool-side ' + fmtH(eff) + ' · ' + shareBasis(t.effShares, t.effSpanSec, s.hashrateWindowSec)
    : (rep > 0 ? 'Device-reported ' + fmtH(rep) : shareBasis(t.effShares, t.effSpanSec, s.hashrateWindowSec));
  $('kOnline').textContent = t.online + ' / ' + t.devices;
  $('kOnlineSub').textContent = [t.offline ? t.offline + ' offline' : 'none offline', t.idle ? t.idle + ' not mining' : '', t.elsewhere ? t.elsewhere + ' mining elsewhere' : '', t.reconnecting ? t.reconnecting + ' reconnecting' : '', t.stale ? t.stale + ' without shares' : ''].filter(Boolean).join(' · ');
  $('kAvg').textContent = t.online ? fmtH(main / t.online) : '—';
  const hashes = s.workers.filter(w => w.status !== 'offline').map(hashOf).filter(h => h > 0);
  $('kAvgSub').textContent = hashes.length ? 'Range ' + fmtH(Math.min(...hashes)) + ' – ' + fmtH(Math.max(...hashes)) : '—';
  const tot = t.accepted + t.rejected;
  $('kShares').textContent = fmtInt(t.accepted);
  $('kSharesSub').textContent = tot ? fmtInt(t.rejected) + ' rejected (' + (100 * t.rejected / tot).toFixed(2) + '%)' : 'No shares yet';
  $('kTemp').textContent = t.avgTemp !== null ? t.avgTemp.toFixed(1) + ' °C avg' : '—';
  const hot = s.workers.filter(w => w.status !== 'offline' && w.cpuTemp !== null).sort((a, b) => b.cpuTemp - a.cpuTemp)[0];
  $('kTempSub').textContent = hot ? 'Hottest ' + hot.name + ' at ' + hot.cpuTemp.toFixed(0) + ' °C' : 'No temperature data yet';

  const li = s.loggedIn;
  $('logout').hidden = !(li && li.viaForm);
  if (li && li.viaForm) $('logout').textContent = 'Log out' + (li.user ? ' (' + li.user + ')' : '');
  $('poolInfo').textContent = s.pool ? 'Mining on ' + s.pool + ' · proxy up ' + fmtDur((now - s.startedAt) / 1000) : '';
  if (s.stratumLagSec > 15) $('poolInfo').textContent += ' · ⚠ no update from the stratum process for ' + s.stratumLagSec + ' s, statuses may be out of date';
}

// ---------- table ----------
function seriesColorFor(name) {
  const i = state.plotted.indexOf(name);
  return i < 0 ? null : css(SERIES[(i + 2) % SERIES.length]);
}
function cell(tr, text, cls) { const td = document.createElement('td'); if (cls) td.className = cls; if (text instanceof Node) td.appendChild(text); else td.textContent = text ?? '—'; tr.appendChild(td); return td; }
function dot(color, label, cls) {
  const s = document.createElement('span'); s.className = cls;
  const i = document.createElement('i'); i.style.background = css(color); s.appendChild(i);
  s.appendChild(document.createTextNode(label)); return s;
}
// pool-side numbers come from random share finds: fewer shares = less certain
function shareBasis(n, spanSec, fallbackSec) {
  if (n === undefined || n === null) return 'over ' + Math.round(fallbackSec / 60) + ' min of shares';
  if (!n) return 'no shares yet';
  return n.toLocaleString() + ' share' + (n === 1 ? '' : 's') + ' in ' + Math.max(1, Math.round(spanSec / 60)) + ' min · ±' + Math.round(100 / Math.sqrt(n)) + '%';
}
function poolSideCell(tr, w) {
  const n = w.effShares;
  if (w.status === 'offline' && !w.effHashrate) return cell(tr, null, 'num');
  const td = cell(tr, (n !== undefined && n < 10 && w.effHashrate ? '~' : '') + fmtH(w.effHashrate), 'num');
  if (n !== undefined && n < 10) td.style.color = css('--muted');
  td.title = 'Pool-side: ' + shareBasis(n, w.effSpanSec, 600) + (n !== undefined && n < 10 ? '. Too few shares for an accurate per-device number; the device-reported figure is the reliable one.' : '');
  return td;
}
function renderHead() {
  const tr = $('thead'); tr.textContent = '';
  for (const c of visibleCols()) {
    const th = document.createElement('th');
    if (c.num) th.className = 'num';
    if (c.nosort) th.classList.add('nosort');
    th.textContent = c.key === 'hash' ? (state.metric === 'rep' ? 'Hashrate' : 'Pool-side')
                   : c.key === 'other' ? (state.metric === 'rep' ? 'Pool-side' : 'Reported') : c.label;
    if (!c.nosort) {
      if (state.sort.key === c.key) { const a = document.createElement('span'); a.className = 'arr'; a.textContent = state.sort.dir > 0 ? '▲' : '▼'; th.appendChild(a); }
      th.addEventListener('click', () => {
        state.sort = { key: c.key, dir: state.sort.key === c.key ? -state.sort.dir : (c.num ? -1 : 1) };
        store.set('sort', state.sort); renderTable();
      });
    }
    // drag a column header onto another to move it
    if (c.key !== PINNED_FIRST && c.key !== PINNED_LAST) {
      th.draggable = true;
      th.title = 'Click to sort · drag to move';
      th.addEventListener('dragstart', (e) => { state.dragCol = c.key; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', c.key); } catch (x) {} th.classList.add('dragging'); });
      th.addEventListener('dragend', () => { state.dragCol = null; th.classList.remove('dragging'); document.querySelectorAll('th.drop-l, th.drop-r').forEach(x => x.classList.remove('drop-l', 'drop-r')); });
      th.addEventListener('dragover', (e) => {
        if (!state.dragCol || state.dragCol === c.key) return;
        e.preventDefault();
        const r = th.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
        th.classList.toggle('drop-r', after); th.classList.toggle('drop-l', !after);
      });
      th.addEventListener('dragleave', () => th.classList.remove('drop-l', 'drop-r'));
      th.addEventListener('drop', (e) => {
        e.preventDefault();
        const r = th.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
        if (state.dragCol && state.dragCol !== c.key) moveCol(state.dragCol, c.key, after);
      });
    }
    tr.appendChild(th);
  }
}
function renderTable() {
  renderHead();
  const rows = filtered();
  const col = COLS.find(c => c.key === state.sort.key) || COLS.find(c => c.key === 'hash');
  rows.sort((a, b) => {
    const va = col.val(a), vb = col.val(b);
    const na = va === null || va === undefined || va === '', nb = vb === null || vb === undefined || vb === '';
    if (na && nb) return a.name.localeCompare(b.name);
    if (na) return 1; if (nb) return -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * state.sort.dir || a.name.localeCompare(b.name);
  });
  const now = state.stats.time;
  const tb = $('tbody'); tb.textContent = '';
  const cols = visibleCols();
  for (const w of rows) {
    const tr = document.createElement('tr');
    if (w.status === 'offline' || w.status === 'idle') tr.className = 'offline';
    for (const c of cols) {
      switch (c.key) {
        case 'plot': {
          const td = cell(tr, '');
          const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = state.plotted.includes(w.name);
          cb.setAttribute('aria-label', 'Plot ' + w.name);
          cb.addEventListener('change', () => togglePlot(w.name, cb.checked));
          td.appendChild(cb);
          break;
        }
        case 'status': {
          const [v, l] = STATUS[w.status] || STATUS.offline;
          const td = cell(tr, dot(v, l, 'status'));
          if (w.status === 'elsewhere') td.title = 'ccminer is running but not connected to this proxy' + (w.minerPoolUrl ? ': it is on ' + w.minerPoolUrl : '') + '. Usually it failed over to its backup pool.';
          else if (w.status === 'reconnecting') td.title = 'Disconnected less than a minute ago; ccminer normally reconnects within seconds.';
          else if (w.status === 'idle') td.title = 'Added by hand. The device answers on its SSH port, but is not mining through this proxy.';
          else if (w.status === 'offline') td.title = (w.manual ? 'Added by hand. No answer on its SSH port or ccminer API' : 'Not connected and ccminer not reachable') + (w.lastSeen ? ' · last seen ' + fmtAgo(w.lastSeen, state.stats.time) : '');
          break;
        }
        case 'name': {
          const td = cell(tr, w.name, 'name');
          const col = seriesColorFor(w.name);
          if (col) { const k = document.createElement('i'); k.className = 'key'; k.style.background = col; td.appendChild(k); }
          if (w.connections > 1) { const s = document.createElement('span'); s.className = 'dim'; s.textContent = ' ×' + w.connections; td.appendChild(s); }
          break;
        }
        case 'group': {
          const td = cell(tr, '');
          td.appendChild(groupSelect(w.group, (g) => groupAction('assign', { workers: [w.name], group: g }), 'Group for ' + w.name));
          break;
        }
        case 'make': cell(tr, w.make); break;
        case 'model': cell(tr, w.model); break;
        case 'soc': cell(tr, w.soc); break;
        case 'os': cell(tr, w.os); break;
        case 'kernel': cell(tr, w.kernel); break;
        case 'arch': cell(tr, w.arch); break;
        case 'cores': cell(tr, w.cores, 'num'); break;
        case 'freq': cell(tr, w.cpuFreq ? fmtInt(w.cpuFreq) : null, 'num'); break;
        case 'ram': cell(tr, w.ramMB ? (w.ramMB / 1024).toFixed(1) + ' GB' : null, 'num'); break;
        case 'temp': {
          const lv = tempLevel(w.cpuTemp);
          cell(tr, lv ? dot(lv[0], w.cpuTemp.toFixed(0) + ' °C', 'temp') : '—', 'num');
          break;
        }
        case 'battery': {
          const parts = [];
          if (w.batteryTemp !== null && w.batteryTemp !== undefined) parts.push(w.batteryTemp.toFixed(1) + ' °C');
          if (w.batteryLevel !== null && w.batteryLevel !== undefined) parts.push(Math.round(w.batteryLevel) + '%' + (/^(charging|full)$/i.test(w.charging || '') ? ' ⚡' : ''));
          cell(tr, parts.length ? parts.join(' · ') : null, 'num'); break;
        }
        case 'load': cell(tr, w.load !== null && w.load !== undefined ? w.load.toFixed(2) : null, 'num'); break;
        case 'hash': state.metric === 'rep' ? cell(tr, fmtH(w.repHashrate), 'num') : poolSideCell(tr, w); break;
        case 'other': state.metric === 'rep' ? poolSideCell(tr, w) : cell(tr, fmtH(w.repHashrate), 'num'); break;
        case 'perCore': cell(tr, fmtH(c.val(w)), 'num'); break;
        case 'threads': cell(tr, w.threads ? w.threads.length : null, 'num'); break;
        case 'shares': cell(tr, fmtInt(w.accepted), 'num'); break;
        case 'rej': { const v = c.val(w); cell(tr, v === null ? null : (v * 100).toFixed(2) + '%', 'num'); break; }
        case 'minerShares': cell(tr, w.minerAccepted !== null && w.minerAccepted !== undefined ? fmtInt(w.minerAccepted) + ' / ' + fmtInt(w.minerRejected) : null, 'num'); break;
        case 'software': cell(tr, w.software); break;
        case 'ping': cell(tr, w.ping, 'num'); break;
        case 'ip': cell(tr, w.ip); break;
        case 'address': cell(tr, w.address); break;
        case 'uptime': cell(tr, w.status === 'offline' ? null : fmtDur(c.val(w)), 'num'); break;
        case 'lastShare': cell(tr, w.lastShare ? fmtAgo(w.lastShare, now) : null, 'num'); break;
        case 'firstSeen': cell(tr, w.firstSeen ? new Date(w.firstSeen).toLocaleDateString() : null, 'num'); break;
        case 'action': {
          const td = cell(tr, '');
          if (state.ssh && state.ssh.enabled) {
            const b = document.createElement('button'); b.className = 'sshbtn'; b.textContent = 'SSH';
            b.title = 'Run a command on ' + w.name;
            b.addEventListener('click', () => sshPick('d:' + w.name));
            td.appendChild(b);
          }
          if ((w.status === 'offline' || w.status === 'idle') && (!state.demo || w.manual)) {
            const b = document.createElement('button'); b.className = 'forget'; b.textContent = w.manual ? 'Remove' : 'Forget';
            b.title = w.manual ? 'Remove this device you added by hand' : 'Remove this device from the dashboard';
            b.addEventListener('click', () => { if (!w.manual || confirm('Remove ' + w.name + ' (' + w.ip + ')?')) forget(w.name); });
            td.appendChild(b);
          }
          break;
        }
      }
    }

// "name 192.168.1.50", "192.168.1.50 name", "192.168.1.50" (name = the address); commas or tabs also work
function parseDeviceLines(text) {
  const out = [];
  for (const raw of text.split(/\n/)) {
    const line = raw.replace(/#.*/, '').trim();
    if (!line) continue;
    const parts = line.split(/[\s,;]+/).filter(Boolean);
    const isIp = (x) => /^\d{1,3}(\.\d{1,3}){3}$/.test(x) || /^[0-9a-f]*:[0-9a-f:]+$/i.test(x);
    const ip = parts.find(isIp) || (parts.length === 1 ? parts[0] : parts[1]);
    const name = parts.find(x => x !== ip) || '';
    out.push({ name, ip, line });
  }
  return out;
}

// sum of several devices' history; missing devices count as 0 for pool-side, as unknown for reported
function sumSeries(h, names) {

    let sum = 0, any = false;
    for (const n of names) { const v = h.workers[n] ? h.workers[n][i] : null; if (v !== null && v !== undefined) { sum += v; any = true; } }
    return any ? sum : (h.metric === 'eff' && names.length ? 0 : null);
  });
}
function chartSeries() {
  const h = state.history; if (!h) return [];
  const totals = state.showTotals || state.plotted.length === 0;
  const out = totals ? [{ name: 'All devices', color: css('--s1'), values: h.total, width: 2.5 }] : [];

  if (totals && filterActive(f)) {
    const names = new Set(filtered().map(w => w.name));
    const vals = h.t.map((_, i) => {
      let sum = 0, any = false;
      for (const n of names) { const v = h.workers[n] ? h.workers[n][i] : null; if (v !== null && v !== undefined) { sum += v; any = true; } }
      return any ? sum : (h.metric === 'eff' ? 0 : null);
    });
    out.push({ name: 'Filtered (' + names.size + ')', color: css('--s2'), values: vals, width: 2 });
  }
  state.plotted.forEach((n, i) => {
    const color = css(SERIES[(i + 2) % SERIES.length]);
    if (n.startsWith('g:')) {

function niceTicks(max, count) {

  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}
const RANGE_MS = { '1h': 3600e3, '6h': 6 * 3600e3, '24h': 24 * 3600e3, '7d': 7 * 86400e3, '30d': 30 * 86400e3 };

  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
// time ticks on round local times: every 10 min, hour, 6 h, midnight, ...

  else { d.setSeconds(0, 0); const mins = step / 60e3; if (mins >= 60) { d.setMinutes(0); d.setHours(d.getHours() - d.getHours() % (mins / 60)); } else d.setMinutes(d.getMinutes() - d.getMinutes() % mins); }

function renderChart() {

    sp.appendChild(i); sp.appendChild(document.createTextNode(s.name)); legend.appendChild(sp);

  const t0 = h && h.from ? h.from : t1 - RANGE_MS[state.range];

  const hit = el('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);

  if (!ps || !ps.pools || ps.pools.length === 0) { $('poolsCard').hidden = true; return; }
  $('poolsCard').hidden = false;
  const now = state.stats ? state.stats.time : Date.now();
  const control = ps.controlEnabled;
  const at = $('autoToggle');
  at.setAttribute('aria-checked', String(ps.auto));
  at.disabled = !control;
  at.title = control ? '' : 'Set dashboard.auth in config.local.json to enable pool control';
  const pref = ps.pools[ps.preferred];
  $('resetPreferred').hidden = !control || ps.pinned === null || ps.pinned === 0;
  $('poolsHint').textContent = !control
    ? 'Read-only: set dashboard.auth in config.local.json to enable switching.'
    : ps.auto
      ? (ps.failback ? 'Fails over when a pool stops answering; returns to ' + pref.name + ' after it has been healthy ' + Math.round(ps.failbackAfterSec / 60) + ' min.' : 'Fails over when a pool stops answering; no automatic return.')
      : 'Auto failover is off: the proxy stays on the active pool even if it goes down.';
  const tb = $('poolsBody'); tb.textContent = '';
  for (const p of ps.pools) {
    const tr = document.createElement('tr');
    const isActive = p.index === ps.active;
    cell(tr, String(p.index + 1), 'num');
    const nameTd = cell(tr, p.name, 'name');
    if (p.index === ps.preferred) { const b = document.createElement('span'); b.className = 'pill'; b.textContent = 'preferred'; nameTd.appendChild(b); }
    const hostLine = document.createElement('div'); hostLine.className = 'dim'; hostLine.style.fontWeight = '400'; hostLine.style.fontSize = '12px';
    hostLine.textContent = p.host + ':' + p.port + (p.ssl ? ' · TLS' : '');
    nameTd.appendChild(hostLine);
    let st;
    if (isActive && p.status === 'down') st = ['--critical', 'Active · not answering'];
    else if (isActive) st = ['--good', 'Active · ' + (p.connections || 0) + ' connection' + (p.connections === 1 ? '' : 's')];
    else if (p.status === 'up') st = ['--good', 'Standby · reachable'];
    else if (p.status === 'down') st = ['--critical', 'Down'];
    else st = ['--muted', 'Checking…'];
    cell(tr, dot(st[0], st[1], 'status'));
    cell(tr, p.pingMs !== null && p.pingMs !== undefined ? p.pingMs + ' ms' : null, 'num');
    cell(tr, isActive || p.hashrate > 0 ? fmtH(p.hashrate) : null, 'num');
    cell(tr, fmtInt(p.accepted), 'num');
    cell(tr, fmtInt(p.rejected), 'num');
    cell(tr, p.lastJob ? fmtAgo(p.lastJob, now) : null, 'num');
    const errTd = cell(tr, p.lastError ? p.lastError + (p.lastErrorAt ? ' · ' + fmtAgo(p.lastErrorAt, now) : '') : '', 'err');
    if (p.lastError) errTd.title = p.lastError;
    const actTd = cell(tr, '');
    if (!isActive) {
      const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'Switch here';
      b.disabled = !control;
      if (!control) b.title = 'Set dashboard.auth in config.local.json to enable pool control';
      b.addEventListener('click', () => {
        if (!confirm('Move all devices to ' + p.name + '?' + (p.status === 'down' ? '\n\nThis pool currently looks DOWN.' : '') + (ps.auto ? '\n\nIt becomes the preferred pool; failover still protects you if it stops answering.' : ''))) return;
        poolAction('switch', { index: p.index });
      });
      actTd.appendChild(b);
    }
    tb.appendChild(tr);
  }
  const ev = $('poolEvents'); ev.textContent = '';
  for (const e of (ps.events || []).slice(0, 6)) {
    const row = document.createElement('div');
    const t = document.createElement('span'); t.className = 't';
    t.textContent = new Date(e.t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const by = document.createElement('span'); by.className = 'by'; by.textContent = e.by === 'manual' ? 'Manual' : e.by === 'auto' ? 'Auto' : '';
    let text = e.reason || '';
    if (e.type === 'switch' && ps.pools[e.from] && ps.pools[e.to]) text = ps.pools[e.from].name + ' → ' + ps.pools[e.to].name + ' · ' + e.reason;
    row.append(t, by, document.createTextNode(text));
    ev.appendChild(row);
  }
}
async function loadPools() {
  try { state.pools = state.demo ? Demo.pools() : await getJSON('api/pools'); } catch (e) { return; }

async function poolAction(action, body) {
  if (state.demo) { Demo.poolAction(action, body); renderPools(); return; }
  try {
    const r = await fetch('api/pools/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-VP-Control': '1' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));

// ---------- remote commands (SSH) ----------
const SSH_STATE = {
  ok: ['--good', 'OK'], failed: ['--serious', 'Exit'], error: ['--critical', 'Error'],
  timeout: ['--critical', 'Timed out'], running: ['--warning', 'Running…'], queued: ['--muted', 'Queued']
};
state.sshOpen = new Set();
state.sshFull = {};
async function loadSsh() {
  try { state.ssh = state.demo ? Demo.sshInfo() : await getJSON('api/ssh'); } catch (e) { return; }
  renderSsh();
}
function sshTargets() {
  const v = $('sshTarget').value, ws = state.stats ? state.stats.workers : [];
  if (v === 'shown') return filtered().map(w => w.name);
  if (v.startsWith('g:')) return ws.filter(w => w.group === v.slice(2)).map(w => w.name);
  if (v.startsWith('d:')) return [v.slice(2)];
  return [];
}
function fillSshTargets() {
  // a target picked from a row's SSH button wins over the current selection
  const sel = $('sshTarget'), cur = state.sshPendingTarget || sel.value || 'shown';
  const ws = state.stats ? state.stats.workers : [];
  const opts = [['shown', 'Devices shown in the table (' + filtered().length + ')']];
  for (const g of groupNames()) opts.push(['g:' + g, 'Group: ' + g + ' (' + ws.filter(w => w.group === g).length + ')']);
  for (const w of ws.slice().sort((a, b) => a.name.localeCompare(b.name))) opts.push(['d:' + w.name, 'Device: ' + w.name + (w.status === 'offline' ? ' (offline)' : '')]);
  const sig = opts.map(o => o.join('=')).join('|');
  if (sel.dataset.sig !== sig) {
    sel.dataset.sig = sig; sel.textContent = '';
    for (const [v, t] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); }
  }
  sel.value = opts.some(o => o[0] === cur) ? cur : 'shown';
  state.sshPendingTarget = null;
}
function sshPick(target) {
  state.sshPendingTarget = target;
  fillSshTargets();
  $('sshCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('sshCmd').focus({ preventScroll: true });
}
function renderSsh() {
  const ss = state.ssh;
  // only shown when the proxy has remote commands switched on
  if (!ss || !ss.enabled) {
    $('sshCard').hidden = true;
    if (ss && ss.reason && !state.demo) $('footNote').textContent = ss.reason + ' See "Remote commands" in the README.';
    return;
  }
  if (!state.demo) $('footNote').textContent = '';
  const first = $('sshCard').hidden;
  $('sshCard').hidden = false;
  if (first && state.stats) renderTable();   // adds the SSH buttons to the rows
  // port choice (from ssh.ports); each port can have its own login
  const ps = $('sshPort'), ports = ss.ports || [{ port: ss.port, user: ss.user, authMode: ss.authMode }];
  const portSig = JSON.stringify(ports);
  if (ps.dataset.sig !== portSig) {
    const cur = Number(ps.value) || state.sshPortPick || ss.port;
    ps.dataset.sig = portSig; ps.textContent = '';
    for (const e of ports) { const o = document.createElement('option'); o.value = e.port; o.textContent = 'Port ' + e.port + (e.name ? ' · ' + e.name : ''); ps.appendChild(o); }
    ps.value = ports.some(e => e.port === cur) ? cur : ss.port;
  }
  ps.hidden = ports.length < 2;
  const pe = ports.find(e => e.port === Number(ps.value)) || ports[0];
  $('sshHint').textContent = 'Runs over SSH as ' + pe.user + '@device:' + pe.port + ' · ' + (pe.authMode === 'password' ? 'password login' : 'key login') +
    (ss.hostKeyCheck === 'off' ? ' · host keys not checked' : '') + ' · stops after ' + ss.timeoutSec + ' s' + (ss.allowCustom ? '' : ' · saved commands only');
  $('sshCmd').readOnly = !ss.allowCustom;
  $('sshCmd').placeholder = ss.allowCustom ? 'Command to run in Termux, e.g. uptime' : 'Pick a saved command below';
  fillSshTargets();
  // presets
  const pr = $('sshPresets');
  const psig = JSON.stringify(ss.presets) + state.sshPreset;
  if (pr.dataset.sig !== psig) {
    pr.dataset.sig = psig; pr.textContent = '';
    for (const p of ss.presets) {
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = p.name; b.title = p.command;
      b.setAttribute('aria-pressed', String(state.sshPreset === p.name));
      b.addEventListener('click', () => { state.sshPreset = p.name; $('sshCmd').value = p.command; renderSsh(); $('sshCmd').focus(); });
      pr.appendChild(b);
    }
  }
  // setup help
  const su = $('sshSetup');
  su.textContent = '';
  const para = (t) => { const d = document.createElement('div'); d.textContent = t; su.appendChild(d); return d; };
  const pre = (t) => { const d = document.createElement('pre'); d.textContent = t; su.appendChild(d); return d; };
  if (ss.authMode === 'password') {
    para('Logging in with the password from ssh.password in config.local.json, so no key setup is needed. Every device needs that same Termux password (set it in Termux with `passwd`).');
  } else {
    para('The proxy logs in with an SSH key. Each device needs the proxy\'s public key once. (On a trusted network you can use a password instead: set ssh.password in config.local.json.)');
  }
  if (ss.authMode === 'password') {
    // nothing to set up on the proxy side
  } else if (ss.publicKey) {
    para('Easiest: on the proxy machine, as user "' + ss.proxyUser + '", run this — it asks each device\'s Termux password once:');
    pre('cd ~/verusProxy && ./deploy/ssh-copy-key.sh');
    para('Or in Termux on a device, paste:');
    pre("mkdir -p ~/.ssh && echo '" + ss.publicKey + "' >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys");
  } else {
    para('No SSH key found for user "' + ss.proxyUser + '" on the proxy machine. Create one there, then run the setup script:');
    pre('ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519\ncd ~/verusProxy && ./deploy/ssh-copy-key.sh');
  }
  para('Termux needs sshd running (`pkg install openssh`, set a password with `passwd`, then `sshd`; add `sshd` to ~/.termux/boot to start it with the phone).');
  renderSshRuns();
}
function renderSshRuns() {
  const box = $('sshRuns'), ss = state.ssh;
  const sig = JSON.stringify(ss.runs) + JSON.stringify([...state.sshOpen].map(id => state.sshFull[id] ? state.sshFull[id].summary : null)) + [...state.sshOpen].join();
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.textContent = '';
  if (!ss.runs.length) {
    const e = document.createElement('div'); e.className = 'gp-empty'; e.textContent = 'No commands run yet. Every run is also written to data/ssh-log.jsonl on the proxy.';
    box.appendChild(e); return;
  }
  for (const r of ss.runs.slice(0, 15)) {
    const wrap = document.createElement('div'); wrap.className = 'run';
    const head = document.createElement('div'); head.className = 'run-head'; head.tabIndex = 0;
    const caret = document.createElement('span'); caret.className = 'caret'; caret.textContent = state.sshOpen.has(r.id) ? '▾' : '▸';
    const when = document.createElement('span'); when.className = 'when';
    when.textContent = new Date(r.t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const cmd = document.createElement('span'); cmd.className = 'cmd mono'; cmd.textContent = r.command; cmd.title = r.command;
    const counts = document.createElement('span'); counts.className = 'counts';
    if (r.ok) counts.appendChild(dot('--good', r.ok + ' ok', 'status'));
    if (r.failed) counts.appendChild(dot('--critical', r.failed + ' failed', 'status'));
    if (r.running) counts.appendChild(dot('--warning', r.running + ' running', 'status'));
    head.append(caret, when, cmd, counts);
    const toggle = () => { state.sshOpen.has(r.id) ? state.sshOpen.delete(r.id) : state.sshOpen.add(r.id); loadSshRun(r.id); };
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    wrap.appendChild(head);
    if (state.sshOpen.has(r.id) && state.sshFull[r.id]) wrap.appendChild(renderRunBody(state.sshFull[r.id]));
    box.appendChild(wrap);
  }
}
function renderRunBody(run) {
  const body = document.createElement('div'); body.className = 'run-body';
  const tools = document.createElement('div'); tools.className = 'run-tools';
  tools.appendChild(document.createTextNode((run.by ? 'Run by ' + run.by + ' · ' : '') + run.targets.length + ' device' + (run.targets.length === 1 ? '' : 's') + (run.port ? ' · port ' + run.port : '')));
  const failed = run.targets.filter(t => t.state !== 'ok' && t.state !== 'running' && t.state !== 'queued').map(t => t.name);
  if (failed.length && run.summary.done) {
    const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'Retry ' + failed.length + ' failed';
    b.addEventListener('click', (e) => { e.stopPropagation(); sshRun(failed, run.command, run.preset, run.port); });
    tools.appendChild(b);
  }
  const again = document.createElement('button'); again.className = 'btn small'; again.textContent = 'Use command';
  again.title = 'Put this command in the box above';
  again.addEventListener('click', (e) => { e.stopPropagation(); $('sshCmd').value = run.command; state.sshPreset = run.preset; $('sshCmd').focus(); });
  tools.appendChild(again);
  body.appendChild(tools);
  // failures first, then by name
  const order = { error: 0, timeout: 0, failed: 1, running: 2, queued: 3, ok: 4 };
  for (const t of run.targets.slice().sort((a, b) => order[a.state] - order[b.state] || a.name.localeCompare(b.name))) {
    const row = document.createElement('div'); row.className = 'res';
    const h = document.createElement('div'); h.className = 'res-head';
    const [col, lbl] = SSH_STATE[t.state] || SSH_STATE.error;
    h.appendChild(dot(col, t.state === 'failed' ? 'Exit ' + t.exit : lbl, 'status'));
    const n = document.createElement('b'); n.textContent = t.name; h.appendChild(n);
    const meta = document.createElement('span'); meta.className = 'dim';
    meta.textContent = [t.ip, t.ms !== null && t.ms !== undefined ? (t.ms / 1000).toFixed(1) + ' s' : ''].filter(Boolean).join(' · ');
    h.appendChild(meta);
    row.appendChild(h);
    if (t.note) { const nt = document.createElement('div'); nt.className = 'note'; nt.textContent = t.note; row.appendChild(nt); }
    if (t.out) { const o = document.createElement('pre'); o.className = 'mono'; o.textContent = t.out.replace(/\n+$/, ''); row.appendChild(o); }
    if (t.err && t.state !== 'error') { const o = document.createElement('pre'); o.className = 'mono err'; o.textContent = t.err.replace(/\n+$/, ''); row.appendChild(o); }
    else if (t.err && t.state === 'error' && !t.note) { const o = document.createElement('pre'); o.className = 'mono err'; o.textContent = t.err.replace(/\n+$/, ''); row.appendChild(o); }
    body.appendChild(row);
  }
  return body;
}
async function loadSshRun(id) {
  try { state.sshFull[id] = state.demo ? Demo.sshGet(id) : await getJSON('api/ssh/run?id=' + encodeURIComponent(id)); } catch (e) {}
  renderSshRuns();

async function sshRun(names, command, preset, port) {
  if (!names.length) { alert('No devices selected.'); return; }
  if (!command.trim()) { alert('Type a command first.'); return; }
  const list = names.length <= 8 ? names.join(', ') : names.slice(0, 8).join(', ') + ' and ' + (names.length - 8) + ' more';
  const portNote = port && state.ssh.ports && state.ssh.ports.length > 1 ? ' on port ' + port : '';
  if (!confirm('Run on ' + names.length + ' device' + (names.length === 1 ? '' : 's') + portNote + ' (' + list + '):\n\n' + command)) return;
  const body = { workers: names };
  if (port) body.port = port;
  if (preset && state.ssh.presets.some(p => p.name === preset && p.command === command)) body.preset = preset; else body.command = command;
  let res;
  try {
    if (state.demo) res = Demo.sshStart(body);
    else {
      const r = await fetch('api/ssh/run', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-VP-Control': '1' }, body: JSON.stringify(body) });
      res = await r.json().catch(() => ({ ok: false, error: r.status }));
    }
  } catch (e) { res = { ok: false, error: 'proxy unreachable' }; }
  if (!res.ok) { alert('Not run: ' + res.error); return; }
  state.sshOpen = new Set([res.id]);
  await loadSsh();
  await loadSshRun(res.id);
  sshPoll();
}
// poll quickly while something is running
function sshPoll() {
  clearTimeout(state.sshTimer);
  const busy = state.ssh && state.ssh.runs.some(r => !r.done);
  if (!busy) return;
  state.sshTimer = setTimeout(async () => {
    await loadSsh();
    for (const id of state.sshOpen) await loadSshRun(id);
    sshPoll();
  }, 1200);
}
$('sshRun').addEventListener('click', () => sshRun(sshTargets(), $('sshCmd').value, state.sshPreset, Number($('sshPort').value) || null));
$('sshCmd').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('sshRun').click(); });
$('sshCmd').addEventListener('input', () => { if (state.sshPreset) { state.sshPreset = null; renderSsh(); } });
$('sshPort').addEventListener('change', () => { state.sshPortPick = Number($('sshPort').value); store.set('sshPort', state.sshPortPick); renderSsh(); });
state.sshPortPick = store.get('sshPort', null);
$('sshSetupBtn').addEventListener('click', () => { $('sshSetup').hidden = !$('sshSetup').hidden; });

// ---------- data ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  // login expired (form login): back to the login page instead of showing stale or demo data
  if (r.status === 401 && !state.demo) { location.href = 'login'; throw new Error('login required'); }
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadStats(force) {
  // don't rebuild the table under an open group dropdown
  if (!force && document.activeElement && document.activeElement.classList.contains('gsel')) return;
  try {
    state.stats = state.demo ? Demo.stats() : await getJSON('api/stats');
    state.lastOk = Date.now();
    setLive(true);
  } catch (e) {
    if (!state.stats) { startDemo(); return; }
    setLive(false);
    return;
  }
  const ws = state.stats.workers;
  fillSelect($('fMake'), ws.map(w => w.make || 'Unknown'), 'All makes');
  fillSelect($('fOs'), ws.map(w => osFamily(w.os)), 'All systems');
  fillGroupFilter();
  if (state.pendingGroupFilter) { $('fGroup').value = state.pendingGroupFilter; state.pendingGroupFilter = null; }
  // drop plotted groups that no longer exist
  const gn = new Set(groupNames());
  const keep = state.plotted.filter(n => !n.startsWith('g:') || gn.has(n.slice(2)));
  if (keep.length !== state.plotted.length) { state.plotted = keep; store.set('plotted', keep); }
  $('plotGroups').hidden = gn.size === 0;
  // group lines depend on membership: redraw the chart only when that changes
  const sig = ws.map(w => w.name + '=' + (w.group || '')).join('|') + '#' + Array.from(gn).join('|');
  if (sig !== state.groupSig) { state.groupSig = sig; renderChart(); }
  renderKpis(); renderTable();
  loadPools();
  loadSsh();
}

async function forget(name) {

function bindSeg(id, key, after) {
  const seg = $(id);
  const paint = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[key])));
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v; store.set(key, state[key]); paint(); after();
  });
  paint();
}
bindSeg('themeSeg', 'theme', () => {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
  // chart, table and pool colors are read from CSS at render time
  if (state.stats) { renderTable(); renderPools(); }
  renderChart();
});

// ---------- demo data (used only when no proxy answers) ----------
const Demo = (() => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const models = [
    ['Samsung', 'Galaxy S10', 'Exynos 9820', 'Android 12', 8, 6.9e6], ['Samsung', 'Galaxy S20 FE', 'Snapdragon 865', 'Android 13', 8, 11.2e6],
    ['Samsung', 'Galaxy A52', 'Snapdragon 720G', 'Android 13', 8, 5.1e6], ['Xiaomi', 'Redmi Note 10 Pro', 'Snapdragon 732G', 'Android 12', 8, 5.6e6],
    ['Xiaomi', 'Poco F3', 'Snapdragon 870', 'Android 13', 8, 12.4e6], ['OnePlus', 'OnePlus 8T', 'Snapdragon 865', 'Android 13', 8, 11.6e6],
    ['Google', 'Pixel 6', 'Google Tensor', 'Android 14', 8, 9.8e6], ['Motorola', 'moto g9 plus', 'Snapdragon 730G', 'Android 11', 8, 5.3e6],
    ['Raspberry', 'Raspberry Pi 4 Model B', 'brcm,bcm2711', 'Debian GNU/Linux 12', 4, 1.9e6], ['Raspberry', 'Raspberry Pi 5 Model B', 'brcm,bcm2712', 'Debian GNU/Linux 12', 4, 4.2e6],
    ['Xunlong', 'Orange Pi 5', 'rockchip,rk3588s', 'Ubuntu 22.04.4 LTS', 8, 8.3e6]
  ];
  const now0 = Date.now();
  const devs = [];
  for (let i = 0; i < 26; i++) {
    const mo = models[Math.floor(rnd() * models.length)];
    const isPi = /Linux|Ubuntu/.test(mo[3]);
    const base = mo[5] * (0.9 + rnd() * 0.2);
    const status = i === 4 || i === 17 ? 'offline' : i === 11 ? 'stale' : 'online';
    devs.push({
      name: (isPi ? 'sbc' : 'phone') + String(i + 1).padStart(2, '0'), make: mo[0], model: mo[1], soc: mo[2], os: mo[3],
      kernel: isPi ? '6.6.31-v8+' : '4.19.' + (100 + Math.floor(rnd() * 150)), arch: 'aarch64', cores: mo[4], ramMB: isPi ? 8000 : 6000 + Math.floor(rnd() * 3) * 2000,
      base, temp: 48 + rnd() * 28 + (base > 10e6 ? 6 : 0), bat: isPi ? null : 30 + rnd() * 9, lvl: isPi ? null : 60 + Math.floor(rnd() * 40),
      ip: '192.168.1.' + (101 + i), since: now0 - (2 + rnd() * 70) * 3600e3, status, born: now0 - (10 + rnd() * 25) * 86400e3,
      acc: Math.floor(base / 1e6 * 900 * (1 + rnd())), rej: Math.floor(rnd() * 8)
    });
  }
  // demo groups: by shelf, plus the single-board computers
  const demoGroupNames = ['Shelf A', 'Shelf B', 'SBCs'];
  devs.forEach((d, i) => { d.group = d.name.startsWith('sbc') ? 'SBCs' : (i < 13 ? 'Shelf A' : 'Shelf B'); });
  function groupAction(action, body) {
    if (action === 'assign') {
      if (body.group && !demoGroupNames.includes(body.group)) demoGroupNames.push(body.group);
      devs.forEach(d => { if (body.workers.includes(d.name)) d.group = body.group || null; });
    } else if (action === 'rename') {
      const to = body.to.trim();
      const i = demoGroupNames.indexOf(body.from);
      if (i >= 0) { if (demoGroupNames.includes(to)) demoGroupNames.splice(i, 1); else demoGroupNames[i] = to; }
      devs.forEach(d => { if (d.group === body.from) d.group = to; });
    } else if (action === 'delete') {
      const i = demoGroupNames.indexOf(body.name); if (i >= 0) demoGroupNames.splice(i, 1);
      devs.forEach(d => { if (d.group === body.name) d.group = null; });
    }
  }
  const wobble = (d, t) => d.base * (1 + 0.04 * Math.sin(t / 3.6e6 + d.base) + 0.03 * Math.sin(t / 5.1e5 + d.temp));
  function stats() {
    const now = Date.now();
    const workers = devs.map(d => {
      const on = d.status !== 'offline' && d.status !== 'idle';
      const rep = on && d.status !== 'stale' ? wobble(d, now) : null;
      return {
        name: d.name, group: d.group || null, status: d.status, manual: !!d.manual, address: 'RDemoWalletAddress', ip: d.ip, connections: on ? 1 : 0, software: 'ccminer/3.8.3', xnsub: true,
        connectedSince: on ? d.since : null, lastShare: d.status === 'online' ? now - rnd() * 40e3 : now - 9 * 60e3,
        lastSeen: now, firstSeen: d.born, effHashrate: rep ? rep * (0.85 + rnd() * 0.3) : 0, repHashrate: rep,
        effShares: rep ? Math.floor(4 + d.base / 1e6 * 2.5) : 0, effSpanSec: 3600,
        accepted: d.acc, rejected: d.rej, minerAccepted: d.acc, minerRejected: d.rej, minerUptime: on ? (now - d.since) / 1000 : null,
        minerSource: 'api', threads: on ? Array(d.cores).fill(0) : null, cpuFreq: on ? 1800 + Math.floor(rnd() * 900) : null, ping: on ? 20 + Math.floor(rnd() * 40) : null,
        cpuTemp: on ? Math.round((d.temp + rnd() * 2) * 10) / 10 : null, make: d.make, model: d.model, soc: d.soc, os: d.os, kernel: d.kernel, arch: d.arch,
        cores: d.cores, ramMB: d.ramMB, batteryTemp: on && d.bat ? Math.round((d.bat + rnd()) * 10) / 10 : null, batteryLevel: on ? d.lvl : null,
        charging: d.lvl ? 'Charging' : null, load: on ? d.cores - rnd() * 0.3 : null, deviceUptime: null, agentSeen: now
      };
    });
    const on = workers.filter(w => w.status !== 'offline' && w.status !== 'idle'), temps = on.map(w => w.cpuTemp).filter(Boolean);
    return {
      time: now, startedAt: now0 - 5.2 * 86400e3, pool: demoPools.pools[demoPools.active].name, hashrateWindowSec: 600, poolConnections: [],
      totals: {
        effHashrate: workers.reduce((a, w) => a + w.effHashrate, 0), effShares: 312, effSpanSec: 1500, repHashrate: workers.reduce((a, w) => a + (w.repHashrate || 0), 0),
        online: on.length, idle: workers.filter(w => w.status === 'idle').length, offline: workers.filter(w => w.status === 'offline').length, stale: workers.filter(w => w.status === 'stale').length, devices: workers.length,
        accepted: workers.reduce((a, w) => a + w.accepted, 0), rejected: workers.reduce((a, w) => a + w.rejected, 0),
        avgTemp: temps.reduce((a, b) => a + b, 0) / temps.length, maxTemp: Math.max(...temps)
      },
      groups: demoGroupNames.map(n => ({ name: n, members: devs.filter(d => d.group === n).length })),
      workers
    };
  }
  function history(range, metric) {
    const sec = { '1h': 3600, '6h': 21600, '24h': 86400, '7d': 604800, '30d': 2592000 }[range];
    const n = Math.min(360, sec / 60), step = sec * 1000 / n, now = Date.now();
    const t = [], workers = {};
    devs.forEach(d => workers[d.name] = []);
    for (let i = 0; i <= n; i++) {
      const ts = now - sec * 1000 + i * step; t.push(ts);
      devs.forEach((d, k) => {
        let v = ts < d.born ? null : wobble(d, ts);
        if (d.status === 'offline' && ts > now - (k === 4 ? 3 : 40) * 3600e3) v = null;
        if (d.status === 'stale' && ts > now - 9 * 60e3) v = null;
        if (v !== null && Math.sin(ts / 9e6 + k * 2) > 0.985) v = null; // occasional dropouts
        if (v !== null && metric === 'eff') v *= 0.8 + 0.4 * Math.abs(Math.sin(ts / 7e5 + k));
        workers[d.name].push(v === null ? (metric === 'eff' ? 0 : null) : Math.round(v));
      });
    }
    const total = t.map((_, i) => devs.reduce((a, d) => a + (workers[d.name][i] || 0), 0));
    return { metric, now, from: now - sec * 1000, step, since: now - 30 * 86400e3, t, total, workers };
  }
  const demoPools = {
    active: 0, preferred: 0, pinned: null, auto: true, failback: true, failbackAfterSec: 300, controlEnabled: true,
    pools: [
      { index: 0, name: 'luckpool NA', host: 'na.luckpool.net', port: 3958, ssl: true, status: 'up', pingMs: 112, accepted: 251344, rejected: 98, lastJob: now0 - 41e3, lastError: 'connection closed by pool', lastErrorAt: now0 - 2.1 * 86400e3, connections: 1 },
      { index: 1, name: 'verus.io', host: 'pool.verus.io', port: 9998, ssl: false, status: 'up', pingMs: 87, accepted: 29647, rejected: 13, lastJob: null, lastError: null, connections: 0 }
    ],
    events: [
      { t: now0 - 2.1 * 86400e3 + 330e3, type: 'switch', from: 1, to: 0, by: 'auto', reason: 'failback: luckpool NA healthy for 5 min' },
      { t: now0 - 2.1 * 86400e3, type: 'switch', from: 0, to: 1, by: 'auto', reason: 'luckpool NA: no reply to shares for 60 s' }
    ]
  };
  function pools() {
    const s = stats(), act = demoPools.pools[demoPools.active];
    demoPools.pools.forEach(p => { p.hashrate = p.index === demoPools.active ? s.totals.effHashrate : 0; p.connections = p.index === demoPools.active ? 1 : 0; });
    return demoPools;
  }
  function poolAction(action, body) {
    const ev = { t: Date.now(), by: 'manual' };
    if (action === 'switch' && body.index !== demoPools.active) {
      Object.assign(ev, { type: 'switch', from: demoPools.active, to: body.index, reason: 'switched to ' + demoPools.pools[body.index].name + ' from the dashboard' });
      demoPools.active = demoPools.preferred = demoPools.pinned = body.index;
    } else if (action === 'auto') { demoPools.auto = body.enabled; Object.assign(ev, { type: 'setting', reason: 'auto failover turned ' + (body.enabled ? 'on' : 'off') }); }
    else if (action === 'reset-preferred') { demoPools.pinned = null; demoPools.preferred = 0; Object.assign(ev, { type: 'setting', reason: 'preferred pool reset to priority order (luckpool NA)' }); }
    else return;
    demoPools.events.unshift(ev);
    state.pools = pools();
  }
  // remote commands demo: fake results so the panel can be tried without devices
  const sshDemo = {
    enabled: true, user: 'eek', port: 8022, timeoutSec: 60, allowCustom: true, proxyUser: 'pi',
    publicKey: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDemoKeyOnlyForTheDemoPageNotARealKey0000 pi@verusproxy',
    presets: [{ name: 'Uptime', command: 'uptime' }, { name: 'ccminer running?', command: "pgrep -af ccminer || echo 'ccminer is NOT running'" },
      { name: 'Battery', command: 'termux-battery-status' }, { name: 'Disk & memory', command: 'df -h $HOME | tail -n 1; free -m | head -n 2' }, { name: 'Stop ccminer', command: 'pkill -f ccminer' }],
    runs: []
  };
  const sshRuns = [];
  const fakeOut = (cmd, d) => {
    if (/uptime/.test(cmd)) return ' ' + new Date().toTimeString().slice(0, 8) + ' up ' + Math.floor((Date.now() - d.since) / 86400e3) + ' days, load average: ' + (d.cores - 0.2).toFixed(2) + ', ' + (d.cores - 0.3).toFixed(2) + ', ' + (d.cores - 0.4).toFixed(2) + '\n';
    if (/pgrep/.test(cmd)) return (11000 + Math.floor(rnd() * 9000)) + ' ./ccminer -a verus -o stratum+tcp://192.168.1.10:8000 -u RDemo.' + d.name + ' -p x -t ' + d.cores + '\n';
    if (/battery/.test(cmd)) return d.lvl ? '{\n  "health": "GOOD",\n  "percentage": ' + d.lvl + ',\n  "status": "CHARGING",\n  "temperature": ' + (d.bat || 33).toFixed(1) + '\n}\n' : 'no battery info\n';
    if (/df/.test(cmd)) return '/dev/fuse        110G   31G   79G  29% /storage/emulated\n              total        used        free\nMem:           ' + d.ramMB + '        ' + Math.floor(d.ramMB * 0.62) + '        ' + Math.floor(d.ramMB * 0.2) + '\n';
    return '';
  };
  function sshSummary(r) {
    const c = { ok: 0, failed: 0, running: 0 };
    r.targets.forEach(t => { if (t.state === 'ok') c.ok++; else if (t.state === 'running' || t.state === 'queued') c.running++; else c.failed++; });
    return { id: r.id, t: r.t, by: 'admin', command: r.command, preset: r.preset, count: r.targets.length, ...c, done: c.running === 0 };
  }
  function sshInfo() { sshDemo.runs = sshRuns.map(sshSummary); return sshDemo; }
  function sshStart(body) {
    const command = body.command || sshDemo.presets.find(p => p.name === body.preset).command;
    const r = { id: 'demo' + sshRuns.length, t: Date.now(), by: 'admin', command, preset: body.preset || null, targets: [] };
    body.workers.forEach((n, i) => {
      const d = devs.find(x => x.name === n);
      const t = { name: n, ip: d ? d.ip : null, state: 'running', exit: null, ms: null, out: '', err: '', note: null };
      r.targets.push(t);
      setTimeout(() => {
        t.ms = 300 + Math.floor(rnd() * 900);
        if (!d || d.status === 'offline') Object.assign(t, { state: 'error', exit: 255, err: 'ssh: connect to host ' + t.ip + ' port 8022: No route to host', note: 'Device not reachable on the network.' });
        else if (i % 9 === 4) Object.assign(t, { state: 'error', exit: 255, err: 'ssh: connect to host ' + t.ip + ' port 8022: Connection refused', note: 'Nothing listening on the SSH port: start sshd in Termux (run `sshd`).' });
        else Object.assign(t, { state: 'ok', exit: 0, out: fakeOut(command, d) });

    return { ok: true, id: r.id };
  }
  function sshGet(id) { const r = sshRuns.find(x => x.id === id); return Object.assign({}, r, { summary: sshSummary(r) }); }
  function addDevices(list, group) {
    const results = [];
    for (const d of list) {
      const name = d.name || d.ip;
      if (!/^(10|127|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(d.ip)) { results.push({ name, ip: d.ip, ok: false, error: d.ip + ' is not a local network address' }); continue; }
      if (!devs.some(x => x.name === name)) {
        devs.push({ name, manual: true, group: group || null, ip: d.ip, status: 'idle', make: null, model: null, soc: null, os: null, kernel: null, arch: null, cores: null, ramMB: null,
          base: 0, temp: 0, bat: null, lvl: null, since: Date.now(), born: Date.now(), acc: 0, rej: 0 });
        if (group && !demoGroupNames.includes(group)) demoGroupNames.push(group);
      }
      results.push({ name, ip: d.ip, ok: true });
    }
    return { ok: results.some(r => r.ok), results };
  }
  function forget(name) { const i = devs.findIndex(d => d.name === name && d.manual); if (i >= 0) devs.splice(i, 1); }
  return { stats, history, pools, poolAction, groupAction, sshInfo, sshStart, sshGet, addDevices, forget };
})();

renderColMenu();

else { loadStats().then(() => { if (!state.demo) loadHistory(); }); }
