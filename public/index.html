<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verus Fleet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 12l4-5 3 3 6-8%22 fill=%22none%22 stroke=%22%232a78d6%22 stroke-width=%222%22/%3E%3C/svg%3E">
<script>try { var th = JSON.parse(localStorage.getItem('vp.theme')); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-ink: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-ink: #0ca30c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
header .meta { color: var(--ink-2); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ring); color: var(--ink-2); }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.live-dot.off { background: var(--critical); }
.spacer { flex: 1; }

.card { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); }
.kpis { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.kpi { padding: 14px 16px; min-width: 0; }
.kpi .label { color: var(--ink-2); font-size: 12.5px; }
.kpi .value { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; white-space: nowrap; }
.kpi.hero .value { font-size: 34px; }
.kpi .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } .kpi.hero { grid-column: 1 / -1; } }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 12px; }
.filters input, .filters select, .btn {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 0; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; padding: 6px 10px; height: 32px;
}
.filters input[type=search] { width: 220px; max-width: 100%; }
.btn { cursor: pointer; }
.btn:hover { background: var(--wash); }
.filters .count { color: var(--ink-2); font-size: 13px; margin-left: 4px; }
.seg { display: inline-flex; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; overflow: hidden; height: 30px; }
.seg button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--ink-2); padding: 0 10px; cursor: pointer; }
.seg button + button { box-shadow: -1px 0 0 var(--ring); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }

.chart-card { padding: 14px 16px 10px; }
.chart-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; }
.chart-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 2px 0 6px; min-height: 18px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
.chart { position: relative; height: 300px; transition: opacity .2s; }
.chart.loading { opacity: .55; }
@media (max-width: 600px) { .chart { height: 220px; } }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  min-width: 160px; display: none;
}
.tip .when { color: var(--muted); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .row i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip .row b { font-weight: 650; font-variant-numeric: tabular-nums; min-width: 72px; }
.tip .row span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

.table-card { margin-top: 12px; }
.table-card .table-scroll { border-radius: 12px 12px 0 0; }
.pools-card { margin-bottom: 12px; overflow: hidden; }
.pools-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px 8px; }
.pools-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.pools-head .hint { color: var(--muted); font-size: 12.5px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle button { width: 34px; height: 20px; border-radius: 999px; border: 0; padding: 0; position: relative; cursor: pointer;
  background: var(--axis); transition: background .15s; }
.toggle button::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle button[aria-checked="true"] { background: var(--good); }
.toggle button[aria-checked="true"]::after { transform: translateX(14px); }
.toggle button:disabled { opacity: .5; cursor: not-allowed; }
.pools-card td.err { color: var(--muted); max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ring); color: var(--ink-2); margin-left: 6px; }
.btn.small { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.events { padding: 8px 16px 12px; color: var(--ink-2); font-size: 12.5px; display: grid; gap: 2px; }
.events .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
.events .by { color: var(--muted); margin-right: 6px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; }
th.nosort { cursor: default; }
th .arr { color: var(--muted); margin-left: 3px; font-size: 10px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--wash); }
tbody tr.offline td { color: var(--muted); }
td .key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; vertical-align: middle; margin-left: 6px; }
td.name { font-weight: 600; }
td .dim { color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.status i, .temp i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.temp { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.forget { font: inherit; font-size: 12px; color: var(--ink-2); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; }
.table-foot { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: var(--muted); font-size: 12.5px; }
.table-foot > span { flex: 1; min-width: 0; }
.table-foot .colmenu { flex: none; }
input[type=checkbox] { accent-color: var(--s1); width: 15px; height: 15px; margin: 0; vertical-align: middle; cursor: pointer; }

.colmenu { position: relative; }
.colmenu .panel {
  position: absolute; right: 0; bottom: 38px; z-index: 10; background: var(--surface); border-radius: 10px;
  box-shadow: 0 0 0 1px var(--ring), 0 8px 24px rgba(0,0,0,.14); padding: 8px; display: none; width: 210px;
  max-height: 360px; overflow: auto;
}
.colmenu.open .panel { display: block; }
.colmenu label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.colmenu label:hover { background: var(--wash); }
.note { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Verus fleet</h1>
    <div class="meta">
      <span id="poolInfo">—</span>
      <span id="liveInfo"><span class="live-dot"></span>connecting…</span>
      <span id="demoBadge" class="badge" hidden>Demo data</span>
    </div>
    <span class="spacer"></span>
    <div class="seg" id="themeSeg" role="group" aria-label="Theme">
      <button data-v="auto" title="Follow the system setting">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
    </div>
  </header>

  <section class="kpis">
    <div class="card kpi hero"><div class="label" id="kHashLabel">Fleet hashrate</div><div class="value" id="kHash">—</div><div class="sub" id="kHashSub">—</div></div>
    <div class="card kpi"><div class="label">Devices online</div><div class="value" id="kOnline">—</div><div class="sub" id="kOnlineSub">—</div></div>
    <div class="card kpi"><div class="label">Average per device</div><div class="value" id="kAvg">—</div><div class="sub" id="kAvgSub">—</div></div>
    <div class="card kpi"><div class="label">Shares</div><div class="value" id="kShares">—</div><div class="sub" id="kSharesSub">—</div></div>
    <div class="card kpi"><div class="label">CPU temperature</div><div class="value" id="kTemp">—</div><div class="sub" id="kTempSub">—</div></div>
  </section>

  <section class="card pools-card" id="poolsCard" hidden>
    <div class="pools-head">
      <h2>Pools</h2>
      <span class="hint" id="poolsHint"></span>
      <span class="spacer"></span>
      <span class="toggle"><button id="autoToggle" role="switch" aria-checked="false" aria-label="Auto failover"></button><label for="autoToggle">Auto failover</label></span>
      <button class="btn small" id="resetPreferred" hidden>Use priority order</button>
    </div>
    <div class="table-scroll"><table>
      <thead><tr><th class="nosort num">#</th><th class="nosort">Pool</th><th class="nosort">Status</th><th class="nosort num">Ping</th><th class="nosort num">Pool-side</th><th class="nosort num">Accepted</th><th class="nosort num">Rejected</th><th class="nosort num" title="Time since the pool's last new job. Long gaps are normal - Verus blocks have no time limit - and never cause a switch.">Last job</th><th class="nosort">Last problem</th><th class="nosort"></th></tr></thead>
      <tbody id="poolsBody"></tbody>
    </table></div>
    <div class="events" id="poolEvents"></div>
  </section>

  <div class="filters" role="group" aria-label="Filters">
    <div class="seg" id="rangeSeg" role="group" aria-label="Time range">
      <button data-v="1h">1h</button><button data-v="6h">6h</button><button data-v="24h">24h</button><button data-v="7d">7d</button><button data-v="30d">30d</button>
    </div>
    <div class="seg" id="metricSeg" role="group" aria-label="Hashrate source">
      <button data-v="rep" title="What ccminer reports on each device">Device-reported</button><button data-v="eff" title="Calculated from shares accepted by the pool">Pool-side</button>
    </div>
    <input type="search" id="q" placeholder="Search name, model, IP…" aria-label="Search devices">
    <select id="fStatus" aria-label="Status"><option value="">All statuses</option><option value="online">Online</option><option value="stale">No shares</option><option value="offline">Offline</option></select>
    <select id="fMake" aria-label="Make"><option value="">All makes</option></select>
    <select id="fOs" aria-label="System"><option value="">All systems</option></select>
    <select id="fTemp" aria-label="Temperature"><option value="">Any temperature</option><option value="60">CPU ≥ 60 °C</option><option value="70">CPU ≥ 70 °C</option><option value="80">CPU ≥ 80 °C</option></select>
    <span class="count" id="filterCount"></span>
    <button class="btn" id="clearFilters" hidden>Clear</button>
  </div>

  <section class="card chart-card">
    <div class="chart-head">
      <h2 id="chartTitle">Hashrate</h2>
      <span class="spacer"></span>
      <button class="btn" id="plotFiltered" title="Plot each filtered device as its own line (up to 6)">Plot filtered devices</button>
      <button class="btn" id="toggleTotals" hidden title="Hide the total lines so individual devices fill the chart">Hide totals</button>
      <button class="btn" id="clearPlot" hidden>Clear plotted</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"><svg id="svg" aria-label="Hashrate over time"></svg><div class="tip" id="tip"></div></div>
  </section>

  <section class="card table-card">
    <div class="table-scroll"><table id="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="table-foot">
      <span id="tableNote">Tick a device to plot it. Click a column to sort.</span>
      <div class="colmenu" id="colmenu"><button class="btn" id="colBtn">Columns</button><div class="panel" id="colPanel"></div></div>
    </div>
  </section>
  <p class="note" id="footNote"></p>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = {
  get(k, d) { try { const v = localStorage.getItem('vp.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vp.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- formatting ----------
function fmtH(h, digits) {
  if (h === null || h === undefined || !isFinite(h)) return '—';
  const u = ['H/s','kH/s','MH/s','GH/s','TH/s','PH/s'];
  let i = 0; while (Math.abs(h) >= 1000 && i < u.length - 1) { h /= 1000; i++; }
  const d = digits !== undefined ? digits : (Math.abs(h) >= 100 ? 1 : 2);
  return h.toFixed(d) + ' ' + u[i];
}
function fmtDur(sec) {
  if (sec === null || sec === undefined || !isFinite(sec)) return '—';
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  if (m) return m + 'm';
  return sec + 's';
}
function fmtAgo(ts, now) { return ts ? fmtDur((now - ts) / 1000) + ' ago' : '—'; }
const fmtInt = (n) => n === null || n === undefined ? '—' : Math.round(n).toLocaleString();
function tempLevel(t) {
  if (t === null || t === undefined) return null;
  if (t >= 80) return ['--critical', 'critical'];
  if (t >= 70) return ['--serious', 'hot'];
  if (t >= 60) return ['--warning', 'warm'];
  return ['--good', 'ok'];
}
const STATUS = { online: ['--good', 'Online'], stale: ['--warning', 'No shares'], offline: ['--critical', 'Offline'] };

// ---------- state ----------
const state = {
  range: store.get('range', '6h'),
  metric: store.get('metric', 'rep'),
  sort: store.get('sort', { key: 'hash', dir: -1 }),
  plotted: store.get('plotted', []),
  showTotals: store.get('showTotals', true),
  theme: store.get('theme', 'auto'),
  hiddenCols: store.get('hiddenCols', ['address','kernel','arch','ram','load','ping','freq','firstSeen','minerShares','threads']),
  stats: null, history: null, demo: false, lastOk: 0
};

// ---------- columns ----------
const hashOf = (w) => state.metric === 'rep' ? (w.repHashrate ?? null) : w.effHashrate;
const COLS = [
  { key: 'plot', label: '', nosort: true, fixed: true },
  { key: 'status', label: 'Status', val: w => ({ online: 0, stale: 1, offline: 2 })[w.status] },
  { key: 'name', label: 'Worker', val: w => w.name.toLowerCase(), fixed: true },
  { key: 'make', label: 'Make', val: w => (w.make || '').toLowerCase() },
  { key: 'model', label: 'Model', val: w => (w.model || '').toLowerCase() },
  { key: 'soc', label: 'SoC / CPU', val: w => (w.soc || '').toLowerCase() },
  { key: 'os', label: 'System', val: w => (w.os || '').toLowerCase() },
  { key: 'kernel', label: 'Kernel', val: w => w.kernel || '' },
  { key: 'arch', label: 'Arch', val: w => w.arch || '' },
  { key: 'cores', label: 'Cores', num: true, val: w => w.cores },
  { key: 'freq', label: 'CPU MHz', num: true, val: w => w.cpuFreq },
  { key: 'ram', label: 'RAM', num: true, val: w => w.ramMB },
  { key: 'temp', label: 'CPU °C', num: true, val: w => w.cpuTemp },
  { key: 'battery', label: 'Battery', num: true, val: w => w.batteryTemp ?? w.batteryLevel },
  { key: 'load', label: 'Load', num: true, val: w => w.load },
  { key: 'hash', label: 'Hashrate', num: true, val: w => hashOf(w) },
  { key: 'other', label: 'Pool-side', num: true, val: w => state.metric === 'rep' ? w.effHashrate : w.repHashrate },
  { key: 'perCore', label: 'Per core', num: true, val: w => { const h = hashOf(w); return h && w.cores ? h / w.cores : null; } },
  { key: 'threads', label: 'Threads', num: true, val: w => w.threads ? w.threads.length : null },
  { key: 'shares', label: 'Accepted', num: true, val: w => w.accepted },
  { key: 'rej', label: 'Reject %', num: true, val: w => (w.accepted + w.rejected) ? w.rejected / (w.accepted + w.rejected) : null },
  { key: 'minerShares', label: 'ccminer A/R', num: true, val: w => w.minerAccepted },
  { key: 'software', label: 'Miner', val: w => w.software || '' },
  { key: 'ping', label: 'Ping ms', num: true, val: w => w.ping },
  { key: 'ip', label: 'IP', val: w => (w.ip || '').split('.').map(x => x.padStart(3, '0')).join('.') },
  { key: 'address', label: 'Wallet', val: w => w.address || '' },
  { key: 'uptime', label: 'Mining for', num: true, val: w => w.minerUptime ?? (w.connectedSince ? (state.stats.time - w.connectedSince) / 1000 : null) },
  { key: 'lastShare', label: 'Last share', num: true, val: w => w.lastShare ? -w.lastShare : null },
  { key: 'firstSeen', label: 'First seen', num: true, val: w => w.firstSeen },
  { key: 'action', label: '', nosort: true, fixed: true }
];

function visibleCols() { return COLS.filter(c => c.fixed || !state.hiddenCols.includes(c.key)); }

// ---------- filtering ----------
function filters() {
  return { q: $('q').value.trim().toLowerCase(), status: $('fStatus').value, make: $('fMake').value, os: $('fOs').value, temp: Number($('fTemp').value) || 0 };
}
function filterActive(f) { return !!(f.q || f.status || f.make || f.os || f.temp); }
function filtered() {
  if (!state.stats) return [];
  const f = filters();
  return state.stats.workers.filter(w => {
    if (f.status && w.status !== f.status) return false;
    if (f.make && (w.make || 'Unknown') !== f.make) return false;
    if (f.os && osFamily(w.os) !== f.os) return false;
    if (f.temp && !(w.cpuTemp >= f.temp)) return false;
    if (f.q) {
      const hay = [w.name, w.make, w.model, w.soc, w.os, w.ip, w.software, w.address].join(' ').toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    return true;
  });
}
function osFamily(os) { if (!os) return 'Unknown'; const m = os.match(/^(Android \d+|[A-Za-z]+(?: [A-Za-z]+)?(?: \d+)?)/); return m ? m[1] : os; }

function fillSelect(sel, values, label) {
  const cur = sel.value;
  const opts = ['', ...Array.from(new Set(values)).sort()];
  if (sel.dataset.sig === opts.join('|')) return;
  sel.dataset.sig = opts.join('|');
  sel.textContent = '';
  for (const v of opts) { const o = document.createElement('option'); o.value = v; o.textContent = v || label; sel.appendChild(o); }
  sel.value = opts.includes(cur) ? cur : '';
}

// ---------- KPIs ----------
function renderKpis() {

  const main = state.metric === 'rep' && rep > 0 ? rep : eff;
  $('kHashLabel').textContent = state.metric === 'rep' && rep > 0 ? 'Fleet hashrate · device-reported' : 'Fleet hashrate · pool-side';
  $('kHash').textContent = fmtH(main);
  $('kHashSub').textContent = state.metric === 'rep' && rep > 0
    ? 'Pool-side ' + fmtH(eff) + ' · ' + shareBasis(t.effShares, t.effSpanSec, s.hashrateWindowSec)
    : (rep > 0 ? 'Device-reported ' + fmtH(rep) : shareBasis(t.effShares, t.effSpanSec, s.hashrateWindowSec));

  $('kAvg').textContent = t.online ? fmtH(main / t.online) : '—';

  $('kTempSub').textContent = hot ? 'Hottest ' + hot.name + ' at ' + hot.cpuTemp.toFixed(0) + ' °C' : 'No temperature data yet';

// ---------- chart ----------
function chartSeries() {
  const h = state.history; if (!h) return [];
  const totals = state.showTotals || state.plotted.length === 0;
  const out = totals ? [{ name: 'All devices', color: css('--s1'), values: h.total, width: 2.5 }] : [];
  const f = filters();
  if (totals && filterActive(f)) {
    const names = new Set(filtered().map(w => w.name));
    const vals = h.t.map((_, i) => {
      let sum = 0, any = false;
      for (const n of names) { const v = h.workers[n] ? h.workers[n][i] : null; if (v !== null && v !== undefined) { sum += v; any = true; } }
      return any ? sum : (h.metric === 'eff' ? 0 : null);
    });
    out.push({ name: 'Filtered (' + names.size + ')', color: css('--s2'), values: vals, width: 2 });
  }
  state.plotted.forEach((n, i) => {
    out.push({ name: n, color: css(SERIES[(i + 2) % SERIES.length]), values: h.workers[n] || h.t.map(() => null), width: 1.5 });
  });

}

    const tx = el('text', { x: m.l - 8, y: y(tv) + 4, 'text-anchor': 'end', fill: css('--muted'), 'font-size': 11, 'font-variant-numeric': 'tabular-nums' }, g);

    const anchor = px - m.l < 30 ? 'start' : W - m.r - px < 30 ? 'end' : 'middle';

function renderPools() {

  $('poolsCard').hidden = false;
  const now = state.stats ? state.stats.time : Date.now();
  const control = ps.controlEnabled;
  const at = $('autoToggle');
  at.setAttribute('aria-checked', String(ps.auto));
  at.disabled = !control;
  at.title = control ? '' : 'Set dashboard.auth in config.json to enable pool control';
  const pref = ps.pools[ps.preferred];
  $('resetPreferred').hidden = !control || ps.pinned === null || ps.pinned === 0;
  $('poolsHint').textContent = !control
    ? 'Read-only: set dashboard.auth in config.json to enable switching.'
    : ps.auto
      ? (ps.failback ? 'Fails over when a pool stops answering; returns to ' + pref.name + ' after it has been healthy ' + Math.round(ps.failbackAfterSec / 60) + ' min.' : 'Fails over when a pool stops answering; no automatic return.')

    const hostLine = document.createElement('div'); hostLine.className = 'dim'; hostLine.style.fontWeight = '400'; hostLine.style.fontSize = '12px';

    nameTd.appendChild(hostLine);

    else if (isActive) st = ['--good', 'Active · ' + (p.connections || 0) + ' connection' + (p.connections === 1 ? '' : 's')];
    else if (p.status === 'up') st = ['--good', 'Standby · reachable'];

    cell(tr, p.lastJob ? fmtAgo(p.lastJob, now) : null, 'num');
    const errTd = cell(tr, p.lastError ? p.lastError + (p.lastErrorAt ? ' · ' + fmtAgo(p.lastErrorAt, now) : '') : '', 'err');
    if (p.lastError) errTd.title = p.lastError;
    const actTd = cell(tr, '');
    if (!isActive) {
      const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'Switch here';
      b.disabled = !control;
      if (!control) b.title = 'Set dashboard.auth in config.json to enable pool control';
      b.addEventListener('click', () => {
        if (!confirm('Move all devices to ' + p.name + '?' + (p.status === 'down' ? '\n\nThis pool currently looks DOWN.' : '') + (ps.auto ? '\n\nIt becomes the preferred pool; failover still protects you if it stops answering.' : ''))) return;
        poolAction('switch', { index: p.index });
      });
      actTd.appendChild(b);
    }
    tb.appendChild(tr);
  }
  const ev = $('poolEvents'); ev.textContent = '';
  for (const e of (ps.events || []).slice(0, 6)) {
    const row = document.createElement('div');
    const t = document.createElement('span'); t.className = 't';
    t.textContent = new Date(e.t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const by = document.createElement('span'); by.className = 'by'; by.textContent = e.by === 'manual' ? 'Manual' : e.by === 'auto' ? 'Auto' : '';
    let text = e.reason || '';
    if (e.type === 'switch' && ps.pools[e.from] && ps.pools[e.to]) text = ps.pools[e.from].name + ' → ' + ps.pools[e.to].name + ' · ' + e.reason;
    row.append(t, by, document.createTextNode(text));
    ev.appendChild(row);
  }
}
async function loadPools() {
  try { state.pools = state.demo ? Demo.pools() : await getJSON('api/pools'); } catch (e) { return; }
  renderPools();
}
async function poolAction(action, body) {
  if (state.demo) { Demo.poolAction(action, body); renderPools(); return; }
  try {
    const r = await fetch('api/pools/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-VP-Control': '1' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) alert('Pool control refused: ' + (j.error || r.status));
  } catch (e) { alert('Proxy unreachable'); }
  setTimeout(loadPools, 400);
}
$('autoToggle').addEventListener('click', () => {
  const on = $('autoToggle').getAttribute('aria-checked') !== 'true';
  if (!on && !confirm('Turn off auto failover? The proxy will then stay on the active pool even if it goes down.')) return;
  poolAction('auto', { enabled: on });
});
$('resetPreferred').addEventListener('click', () => poolAction('reset-preferred'));

// ---------- data ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadStats() {
  try {
    state.stats = state.demo ? Demo.stats() : await getJSON('api/stats');
    state.lastOk = Date.now();
    setLive(true);
  } catch (e) {
    if (!state.stats) { startDemo(); return; }
    setLive(false);
    return;
  }
  const ws = state.stats.workers;
  fillSelect($('fMake'), ws.map(w => w.make || 'Unknown'), 'All makes');
  fillSelect($('fOs'), ws.map(w => osFamily(w.os)), 'All systems');
  renderKpis(); renderTable();
  loadPools();
}
async function loadHistory() {
  $('chart').classList.add('loading');
  try {
    state.history = state.demo ? Demo.history(state.range, state.metric) : await getJSON('api/history?range=' + state.range + '&metric=' + state.metric);
    // no ccminer API data reachable yet: fall back to the pool-side series
    if (!state.demo && state.metric === 'rep' && state.history.total.every(v => v === null)) {
      state.history = await getJSON('api/history?range=' + state.range + '&metric=eff');
    }
  } catch (e) {}
  $('chart').classList.remove('loading');
  renderChart();
}
function setLive(ok) {
  const li = $('liveInfo'); li.textContent = '';
  const d = document.createElement('span'); d.className = 'live-dot' + (ok ? '' : ' off'); li.appendChild(d);
  li.appendChild(document.createTextNode(state.demo ? 'Simulated fleet' : ok ? 'Live · updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'Proxy unreachable — showing last data'));
}
async function forget(name) {
  try { await fetch('api/forget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ worker: name }) }); } catch (e) {}
  state.plotted = state.plotted.filter(n => n !== name); store.set('plotted', state.plotted);
  loadStats();
}
function startDemo() {
  state.demo = true;
  $('demoBadge').hidden = false;
  $('footNote').textContent = 'Demo data: this page is not connected to a verusProxy. Served by the proxy (http://<proxy-ip>:8080) it shows your live fleet.';
  loadStats(); loadHistory();
}

// ---------- controls ----------
function bindSeg(id, key, after) {
  const seg = $(id);
  const paint = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[key])));
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v; store.set(key, state[key]); paint(); after();
  });
  paint();
}
bindSeg('themeSeg', 'theme', () => {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
  // chart, table and pool colors are read from CSS at render time
  if (state.stats) { renderTable(); renderPools(); }
  renderChart();
});
bindSeg('rangeSeg', 'range', loadHistory);
bindSeg('metricSeg', 'metric', () => { loadHistory(); if (state.stats) { renderKpis(); renderTable(); } });
for (const id of ['q', 'fStatus', 'fMake', 'fOs', 'fTemp']) $(id).addEventListener('input', () => { renderTable(); renderChart(); });
$('clearFilters').addEventListener('click', () => { $('q').value = ''; for (const id of ['fStatus', 'fMake', 'fOs', 'fTemp']) $(id).value = ''; renderTable(); renderChart(); });
$('plotFiltered').addEventListener('click', () => {
  const col = COLS.find(c => c.key === state.sort.key) || COLS.find(c => c.key === 'hash');
  const rows = filtered().slice().sort((a, b) => ((col.val(b) ?? -Infinity) > (col.val(a) ?? -Infinity) ? 1 : -1) * (state.sort.dir < 0 ? 1 : -1));
  state.plotted = rows.slice(0, 6).map(w => w.name); store.set('plotted', state.plotted);
  renderTable(); renderChart();
});
$('toggleTotals').addEventListener('click', () => { state.showTotals = !state.showTotals; store.set('showTotals', state.showTotals); renderTable(); renderChart(); });
$('clearPlot').addEventListener('click', () => { state.plotted = []; store.set('plotted', []); renderTable(); renderChart(); });
$('colBtn').addEventListener('click', (e) => { e.stopPropagation(); $('colmenu').classList.toggle('open'); });
document.addEventListener('click', (e) => { if (!$('colmenu').contains(e.target)) $('colmenu').classList.remove('open'); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderChart, 120); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.stats) { renderTable(); renderChart(); } });

// ---------- demo data (used only when no proxy answers) ----------
const Demo = (() => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const models = [
    ['Samsung', 'Galaxy S10', 'Exynos 9820', 'Android 12', 8, 6.9e6], ['Samsung', 'Galaxy S20 FE', 'Snapdragon 865', 'Android 13', 8, 11.2e6],
    ['Samsung', 'Galaxy A52', 'Snapdragon 720G', 'Android 13', 8, 5.1e6], ['Xiaomi', 'Redmi Note 10 Pro', 'Snapdragon 732G', 'Android 12', 8, 5.6e6],
    ['Xiaomi', 'Poco F3', 'Snapdragon 870', 'Android 13', 8, 12.4e6], ['OnePlus', 'OnePlus 8T', 'Snapdragon 865', 'Android 13', 8, 11.6e6],
    ['Google', 'Pixel 6', 'Google Tensor', 'Android 14', 8, 9.8e6], ['Motorola', 'moto g9 plus', 'Snapdragon 730G', 'Android 11', 8, 5.3e6],
    ['Raspberry', 'Raspberry Pi 4 Model B', 'brcm,bcm2711', 'Debian GNU/Linux 12', 4, 1.9e6], ['Raspberry', 'Raspberry Pi 5 Model B', 'brcm,bcm2712', 'Debian GNU/Linux 12', 4, 4.2e6],
    ['Xunlong', 'Orange Pi 5', 'rockchip,rk3588s', 'Ubuntu 22.04.4 LTS', 8, 8.3e6]
  ];
  const now0 = Date.now();
  const devs = [];
  for (let i = 0; i < 26; i++) {
    const mo = models[Math.floor(rnd() * models.length)];
    const isPi = /Linux|Ubuntu/.test(mo[3]);
    const base = mo[5] * (0.9 + rnd() * 0.2);
    const status = i === 4 || i === 17 ? 'offline' : i === 11 ? 'stale' : 'online';
    devs.push({
      name: (isPi ? 'sbc' : 'phone') + String(i + 1).padStart(2, '0'), make: mo[0], model: mo[1], soc: mo[2], os: mo[3],
      kernel: isPi ? '6.6.31-v8+' : '4.19.' + (100 + Math.floor(rnd() * 150)), arch: 'aarch64', cores: mo[4], ramMB: isPi ? 8000 : 6000 + Math.floor(rnd() * 3) * 2000,
      base, temp: 48 + rnd() * 28 + (base > 10e6 ? 6 : 0), bat: isPi ? null : 30 + rnd() * 9, lvl: isPi ? null : 60 + Math.floor(rnd() * 40),
      ip: '192.168.1.' + (101 + i), since: now0 - (2 + rnd() * 70) * 3600e3, status, born: now0 - (10 + rnd() * 25) * 86400e3,
      acc: Math.floor(base / 1e6 * 900 * (1 + rnd())), rej: Math.floor(rnd() * 8)
    });
  }
  const wobble = (d, t) => d.base * (1 + 0.04 * Math.sin(t / 3.6e6 + d.base) + 0.03 * Math.sin(t / 5.1e5 + d.temp));
  function stats() {
    const now = Date.now();
    const workers = devs.map(d => {
      const on = d.status !== 'offline';
      const rep = on && d.status !== 'stale' ? wobble(d, now) : null;
      return {
        name: d.name, status: d.status, address: 'RDemoWalletAddress', ip: d.ip, connections: on ? 1 : 0, software: 'ccminer/3.8.3', xnsub: true,
        connectedSince: on ? d.since : null, lastShare: d.status === 'online' ? now - rnd() * 40e3 : now - 9 * 60e3,
        lastSeen: now, firstSeen: d.born, effHashrate: rep ? rep * (0.85 + rnd() * 0.3) : 0, repHashrate: rep,
        effShares: rep ? Math.floor(4 + d.base / 1e6 * 2.5) : 0, effSpanSec: 3600,
        accepted: d.acc, rejected: d.rej, minerAccepted: d.acc, minerRejected: d.rej, minerUptime: on ? (now - d.since) / 1000 : null,
        minerSource: 'api', threads: on ? Array(d.cores).fill(0) : null, cpuFreq: on ? 1800 + Math.floor(rnd() * 900) : null, ping: on ? 20 + Math.floor(rnd() * 40) : null,
        cpuTemp: on ? Math.round((d.temp + rnd() * 2) * 10) / 10 : null, make: d.make, model: d.model, soc: d.soc, os: d.os, kernel: d.kernel, arch: d.arch,
        cores: d.cores, ramMB: d.ramMB, batteryTemp: on && d.bat ? Math.round((d.bat + rnd()) * 10) / 10 : null, batteryLevel: on ? d.lvl : null,
        charging: d.lvl ? 'Charging' : null, load: on ? d.cores - rnd() * 0.3 : null, deviceUptime: null, agentSeen: now
      };
    });
    const on = workers.filter(w => w.status !== 'offline'), temps = on.map(w => w.cpuTemp).filter(Boolean);
    return {
      time: now, startedAt: now0 - 5.2 * 86400e3, pool: demoPools.pools[demoPools.active].name, hashrateWindowSec: 600, poolConnections: [],
      totals: {
        effHashrate: workers.reduce((a, w) => a + w.effHashrate, 0), effShares: 312, effSpanSec: 1500, repHashrate: workers.reduce((a, w) => a + (w.repHashrate || 0), 0),
        online: on.length, offline: workers.length - on.length, stale: workers.filter(w => w.status === 'stale').length, devices: workers.length,
        accepted: workers.reduce((a, w) => a + w.accepted, 0), rejected: workers.reduce((a, w) => a + w.rejected, 0),
        avgTemp: temps.reduce((a, b) => a + b, 0) / temps.length, maxTemp: Math.max(...temps)
      },
      workers
    };
  }
  function history(range, metric) {
    const sec = { '1h': 3600, '6h': 21600, '24h': 86400, '7d': 604800, '30d': 2592000 }[range];
    const n = Math.min(360, sec / 60), step = sec * 1000 / n, now = Date.now();
    const t = [], workers = {};
    devs.forEach(d => workers[d.name] = []);
    for (let i = 0; i <= n; i++) {
      const ts = now - sec * 1000 + i * step; t.push(ts);
      devs.forEach((d, k) => {
        let v = ts < d.born ? null : wobble(d, ts);
        if (d.status === 'offline' && ts > now - (k === 4 ? 3 : 40) * 3600e3) v = null;
        if (d.status === 'stale' && ts > now - 9 * 60e3) v = null;
        if (v !== null && Math.sin(ts / 9e6 + k * 2) > 0.985) v = null; // occasional dropouts
        if (v !== null && metric === 'eff') v *= 0.8 + 0.4 * Math.abs(Math.sin(ts / 7e5 + k));
        workers[d.name].push(v === null ? (metric === 'eff' ? 0 : null) : Math.round(v));
      });
    }
    const total = t.map((_, i) => devs.reduce((a, d) => a + (workers[d.name][i] || 0), 0));
    return { metric, now, from: now - sec * 1000, step, since: now - 30 * 86400e3, t, total, workers };
  }
  const demoPools = {
    active: 0, preferred: 0, pinned: null, auto: true, failback: true, failbackAfterSec: 300, controlEnabled: true,
    pools: [
      { index: 0, name: 'luckpool NA', host: 'na.luckpool.net', port: 3958, ssl: true, status: 'up', pingMs: 112, accepted: 251344, rejected: 98, lastJob: now0 - 41e3, lastError: 'connection closed by pool', lastErrorAt: now0 - 2.1 * 86400e3, connections: 1 },
      { index: 1, name: 'verus.io', host: 'pool.verus.io', port: 9998, ssl: false, status: 'up', pingMs: 87, accepted: 29647, rejected: 13, lastJob: null, lastError: null, connections: 0 }
    ],
    events: [
      { t: now0 - 2.1 * 86400e3 + 330e3, type: 'switch', from: 1, to: 0, by: 'auto', reason: 'failback: luckpool NA healthy for 5 min' },
      { t: now0 - 2.1 * 86400e3, type: 'switch', from: 0, to: 1, by: 'auto', reason: 'luckpool NA: no reply to shares for 60 s' }
    ]
  };
  function pools() {
    const s = stats(), act = demoPools.pools[demoPools.active];
    demoPools.pools.forEach(p => { p.hashrate = p.index === demoPools.active ? s.totals.effHashrate : 0; p.connections = p.index === demoPools.active ? 1 : 0; });
    return demoPools;
  }
  function poolAction(action, body) {
    const ev = { t: Date.now(), by: 'manual' };
    if (action === 'switch' && body.index !== demoPools.active) {
      Object.assign(ev, { type: 'switch', from: demoPools.active, to: body.index, reason: 'switched to ' + demoPools.pools[body.index].name + ' from the dashboard' });
      demoPools.active = demoPools.preferred = demoPools.pinned = body.index;
    } else if (action === 'auto') { demoPools.auto = body.enabled; Object.assign(ev, { type: 'setting', reason: 'auto failover turned ' + (body.enabled ? 'on' : 'off') }); }

  }

})();

renderColMenu();
if (/[?&]demo\b/.test(location.search) || location.protocol === 'file:') startDemo();
else { loadStats().then(() => { if (!state.demo) loadHistory(); }); }
setInterval(() => { if (!state.demo) loadStats(); }, 10000);
setInterval(() => { if (!state.demo) loadHistory(); }, 60000);
})();
